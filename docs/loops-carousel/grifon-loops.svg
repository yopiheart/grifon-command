<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1280" viewBox="0 0 1000 1280" font-family="Segoe UI, Arial, sans-serif">
  <!-- canvas -->
  <rect width="1000" height="1280" fill="#09090b"/>

  <!-- title -->
  <text x="500" y="58" fill="#FFCC00" font-size="38" font-weight="bold" text-anchor="middle">🦅 GRIFON LOOPS — Simpleng Gabay</text>
  <text x="500" y="92" fill="#a1a1aa" font-size="19" text-anchor="middle">Paano ko inaayos, dinadagdagan, at pinapaganda ang app</text>

  <!-- ===================== LEFT: FIX / ADD WORKFLOW ===================== -->
  <rect x="40" y="120" width="430" height="560" rx="18" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <text x="255" y="160" fill="#FFCC00" font-size="23" font-weight="bold" text-anchor="middle">🔧 Pag may gagawin</text>

  <!-- fix steps -->
  <text x="65" y="200" fill="#fafafa" font-size="18" font-weight="bold">AYUSIN ANG SIRA (7 hakbang):</text>
  <g fill="#d4d4d8" font-size="16.5">
    <text x="75" y="232">1️⃣  Reproduce — tingnan ang sira</text>
    <text x="75" y="262">2️⃣  Hanapin — saang file?</text>
    <text x="75" y="292">3️⃣  Plano — ano + bakit babaguhin</text>
    <text x="75" y="322">4️⃣  Edit — maliit lang (surgical)</text>
    <text x="75" y="352">5️⃣  Verify — build + test sa browser</text>
    <text x="75" y="382">6️⃣  Update — burahin sa punch-list</text>
    <text x="75" y="412">7️⃣  Report — 1 sentence lang</text>
  </g>

  <line x1="65" y1="438" x2="445" y2="438" stroke="#27272a" stroke-width="2"/>

  <text x="65" y="472" fill="#fafafa" font-size="18" font-weight="bold">BAGONG MODULE:</text>
  <g fill="#d4d4d8" font-size="16.5">
    <text x="75" y="504">🧱  "Vertical slice" — isa lang feature,</text>
    <text x="95" y="528">pero BUO: types + service +</text>
    <text x="95" y="552">UI + state. May gumagana agad!</text>
    <text x="75" y="590">🎨  Sundin ang DESIGN.md</text>
    <text x="95" y="614">gold #FFCC00, GlassPanel,</text>
    <text x="95" y="638">GoldButton, bg-zinc-950</text>
  </g>

  <!-- ===================== RIGHT: WAT ===================== -->
  <rect x="510" y="120" width="450" height="560" rx="18" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <text x="735" y="160" fill="#FFCC00" font-size="23" font-weight="bold" text-anchor="middle">🧱 WAT — Ang Pundasyon</text>

  <rect x="545" y="195" width="380" height="120" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="565" y="228" fill="#FFCC00" font-size="18" font-weight="bold">Workflows  📋</text>
  <text x="565" y="258" fill="#d4d4d8" font-size="16">Mga recipe (markdown sa workflows/)</text>
  <text x="565" y="284" fill="#d4d4d8" font-size="16">"Ito ang dapat gawin."</text>

  <text x="735" y="345" fill="#71717a" font-size="26" text-anchor="middle">⬇</text>

  <rect x="545" y="360" width="380" height="120" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="565" y="393" fill="#FFCC00" font-size="18" font-weight="bold">Agent (ako) 🧠</text>
  <text x="565" y="423" fill="#d4d4d8" font-size="16">Ako ang nag-iisip at nagde-desisyon.</text>
  <text x="565" y="449" fill="#d4d4d8" font-size="16">"Aling tool ang gagamitin?"</text>

  <text x="735" y="510" fill="#71717a" font-size="26" text-anchor="middle">⬇</text>

  <rect x="545" y="525" width="380" height="120" rx="12" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  <text x="565" y="558" fill="#FFCC00" font-size="18" font-weight="bold">Tools  ⚙️</text>
  <text x="565" y="588" fill="#d4d4d8" font-size="16">Python scripts (tools/) — sila gumawa</text>
  <text x="565" y="614" fill="#d4d4d8" font-size="16">ng totoong trabaho. Walang mali.</text>

  <!-- ===================== BOTTOM: 6 GUARDS / LOOPS ===================== -->
  <rect x="40" y="710" width="920" height="540" rx="18" fill="#18181b" stroke="#27272a" stroke-width="2"/>
  <text x="500" y="752" fill="#FFCC00" font-size="24" font-weight="bold" text-anchor="middle">🔁 Ang 6 na Bantay (Loops) — sila nagche-check habang gumagawa ka</text>

  <!-- guard rows -->
  <g font-size="16.5">
    <!-- 0 -->
    <rect x="70" y="780" width="860" height="62" rx="10" fill="#1c1917" stroke="#FFCC00" stroke-width="2"/>
    <text x="92" y="810" fill="#FFCC00" font-size="19" font-weight="bold">0 · Build-gate 🚪</text>
    <text x="92" y="832" fill="#a1a1aa" font-size="14.5">AUTO</text>
    <text x="320" y="818" fill="#e4e4e7">Hindi ka makakatigil kung sira pa ang <tspan fill="#FFCC00">npm run build</tspan>. Pinaka-importante!</text>

    <!-- 0b -->
    <rect x="70" y="850" width="860" height="62" rx="10" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
    <text x="92" y="880" fill="#FFCC00" font-size="19" font-weight="bold">0b · Cloud CI ☁️</text>
    <text x="92" y="902" fill="#a1a1aa" font-size="14.5">AUTO</text>
    <text x="320" y="888" fill="#e4e4e7">Robot sa GitHub na nag-bu-build + test tuwing may PR. Bantay-bayan.</text>

    <!-- 1 -->
    <rect x="70" y="920" width="860" height="62" rx="10" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
    <text x="92" y="950" fill="#FFCC00" font-size="19" font-weight="bold">1 · /goal 🎯</text>
    <text x="92" y="972" fill="#a1a1aa" font-size="14.5">PER TASK</text>
    <text x="320" y="958" fill="#e4e4e7">"Tapusin mo 'to, ito ang check, 20 turns lang." Uulit hanggang tapos.</text>

    <!-- 2 -->
    <rect x="70" y="990" width="860" height="62" rx="10" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
    <text x="92" y="1020" fill="#FFCC00" font-size="19" font-weight="bold">2 · Session ⏰</text>
    <text x="92" y="1042" fill="#a1a1aa" font-size="14.5">SA BOOT</text>
    <text x="320" y="1028" fill="#e4e4e7">Pag nag-restart ang PC, ni-re-remind ka ng break + listahan ng loops.</text>

    <!-- 3 -->
    <rect x="70" y="1060" width="860" height="62" rx="10" fill="#141414" stroke="#3f3f46" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="92" y="1090" fill="#a8a29e" font-size="19" font-weight="bold">3 · Nightly 🌙</text>
    <text x="92" y="1112" fill="#a1a1aa" font-size="14.5">⏸ PARK</text>
    <text x="320" y="1098" fill="#a1a1aa">Gabi-gabing test ng lahat ng module. Naka-park muna — bukas pag live na beta.</text>

    <!-- 4 -->
    <rect x="70" y="1130" width="860" height="62" rx="10" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
    <text x="92" y="1160" fill="#FFCC00" font-size="19" font-weight="bold">4 · Meta 🧠</text>
    <text x="92" y="1182" fill="#a1a1aa" font-size="14.5">HABIT</text>
    <text x="320" y="1168" fill="#e4e4e7">May nagkamali → ayusin → isulat ang aral. Para di na maulit.</text>

    <!-- 5 -->
    <rect x="70" y="1200" width="860" height="42" rx="10" fill="#1c1917" stroke="#3f3f46" stroke-width="2"/>
    <text x="92" y="1227" fill="#FFCC00" font-size="19" font-weight="bold">5 · PR Babysit 👶</text>
    <text x="320" y="1227" fill="#e4e4e7">Sa web — auto-ayos ang PR pag may CI fail o review comment.</text>
  </g>
</svg>
