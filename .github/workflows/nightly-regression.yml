name: Nightly Regression

# Tier 3 loop (Loop Engineering / Move 1). A true discovery→verify→persist
# loop that runs in the cloud while Neil sleeps and survives the cafe-PC
# defreezer (local /loop cannot — it needs the machine on). Runs the live
# Gemini ad-script regression suite against real Gemini, and on failure opens
# a GitHub Issue + uploads the run output. It NEVER edits prompts and NEVER
# auto-merges — it only surfaces. Full SOP: workflows/nightly_regression.md.
#
# v1 scope: the adscript regression suite
# (tests/regression/script-gen.regression.test.ts), deterministic-invariant
# assertions only — no LLM evaluator, no ANTHROPIC_API_KEY in CI yet.
#
# v2 (2026-08-14): + the EDL video-attach canary
# (tests/regression/edl-video-part.regression.test.ts). THIS IS THE POINT OF THE
# WHOLE LOOP. The EDL went blind for every user for ~2 weeks and nothing noticed,
# because no run was attempted in between and every unit test mocks the proxy.
# The fix without a schedule leaves that lesson half-learned: the failure was
# *detectable*, nothing was *detecting*. One cheap live call a night closes it.
#
# NOTE the canary runs on RUN_REGRESSION only. The full-cap probe in the same
# file is gated separately on RUN_EDL_FULL_CAP and is deliberately NOT set here —
# ten videos a night is real spend for a question already answered by hand
# (2026-08-14: ten parts → 200). Re-run that one manually after any change to
# EDL_MAX_ATTACHED_VIDEOS, the attach path, or the EDL model id.
on:
  schedule:
    # 18:00 UTC = ~02:00 PHT — runs overnight, Manila time.
    # NOTE: GitHub runs scheduled workflows from the DEFAULT branch (main)
    # only; pre-merge testing is via the workflow_dispatch trigger below.
    - cron: '0 18 * * *'
  workflow_dispatch:

# One nightly run at a time; a new run does not pile on top of an in-flight one.
concurrency:
  group: nightly-regression
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  regression:
    runs-on: ubuntu-latest
    # Fixed fixtures; production classifiers/retries can add provider calls.
    # Bound wall time too, so a hung call cannot run overnight.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Stage output dir
        id: stage
        run: mkdir -p .tmp/regression

      # RUN_REGRESSION=1 opts the live suite in (it is describe.skipIf'd off by
      # default). The harness reads process.env.GEMINI_API_KEY directly; the
      # absent .env file in CI is handled by its own try/catch.
      #
      # Preflight guard: if the GEMINI_API_KEY secret is not set yet, SKIP
      # cleanly (green, with a visible warning) instead of failing — otherwise
      # the nightly cron would open a false-alarm "FAILED" issue every night
      # before the secret is added. A skipped run is annotated, never silent
      # (the paper's "no silent caps"). Once the secret exists it runs for real.
      - name: Run live Gemini regressions (ad-script + EDL video-attach canary)
        id: regression
        env:
          RUN_REGRESSION: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "skipped_reason=missing_key" >> "$GITHUB_OUTPUT"
            echo "::warning::GEMINI_API_KEY secret not set — skipping nightly regression (no-op). Add it in repo Settings → Secrets and variables → Actions to activate the loop."
            echo "### ⏭️ Nightly regression skipped — GEMINI_API_KEY not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx vitest run \
            tests/regression/script-gen.regression.test.ts \
            tests/regression/edl-video-part.regression.test.ts \
            --reporter=verbose \
            --reporter=json --outputFile=.tmp/regression/results.json

      # Persistence #1: the run output survives the conversation/run (the
      # paper's "memory"). Always upload, pass or fail, so a flaky night is
      # diagnosable from the artifact.
      - name: Upload regression results
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-results
          path: .tmp/regression/
          if-no-files-found: warn
          retention-days: 30

      # Report the failed stage, not a guessed prompt defect. Inline so setup
      # failures can still be reported without checkout or npm dependencies.
      - name: Report nightly regression outcome
        if: always()
        uses: actions/github-script@v7
        env:
          NIGHTLY_STEPS: ${{ toJSON(steps) }}
        with:
          script: |
            const fs = require('fs');
            const steps = JSON.parse(process.env.NIGHTLY_STEPS);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const setupStages = [
              ['checkout', 'Checkout repository'],
              ['setup_node', 'Set up Node'],
              ['install', 'Install dependencies'],
              ['stage', 'Stage output dir'],
            ];
            const setupFailure = setupStages.find(([id]) => steps[id]?.outcome === 'failure');
            const execution = steps.regression;
            const missingKey = execution?.outputs?.skipped_reason === 'missing_key';
            const failed = [];
            let completeResults = false;
            if (!setupFailure && !missingKey && ['success', 'failure'].includes(execution?.outcome)) {
              try {
                const raw = JSON.parse(fs.readFileSync('.tmp/regression/results.json', 'utf8'));
                const assertions = raw.testResults.flatMap(f => f.assertionResults || []);
                for (const a of assertions) {
                  if (a.status === 'failed') failed.push(a.fullName || a.title || '(unnamed assertion)');
                }
                completeResults = raw.success === true && assertions.some(a => a.status === 'passed');
              } catch (e) {
                core.warning(`No usable regression results: ${e.message}`);
              }
            }

            let title;
            let detail;
            let needsIssue = true;
            if (setupFailure) {
              title = 'Nightly regression setup FAILED';
              detail = `Failed setup stage: **${setupFailure[1]}**. Gemini tests did not run. Inspect the setup log; this is not evidence of a prompt defect.`;
            } else if (missingKey) {
              title = 'Nightly regression skipped';
              detail = 'GEMINI_API_KEY was not set. Gemini tests did not run.';
              needsIssue = false;
            } else if (failed.length) {
              title = 'Nightly regression assertions FAILED';
              detail = `**Failed checks:**\n${failed.map(n => `- ${n}`).join('\n')}\n\nInspect assertion errors and generated output before assigning a cause.`;
              if (failed.some(n => /EDL live/i.test(n))) {
                detail += '\n\nThe EDL canary has a failed assertion. Consult workflows/edl_files_api_plan.md; the test name alone does not establish provider failure, quota exhaustion, or a production incident.';
              }
            } else if (execution?.outcome === 'success' && completeResults) {
              title = 'Nightly regression passed';
              detail = 'The live regression step passed with recorded test results.';
              needsIssue = false;
            } else if (!execution || ['skipped', 'cancelled'].includes(execution.outcome)) {
              title = 'Nightly regression skipped or cancelled';
              detail = 'No completed Gemini test execution was recorded. Check the run status; no output-quality verdict is available.';
              needsIssue = false;
            } else {
              title = 'Nightly regression execution FAILED';
              detail = 'Test execution did not produce a successful result with identifiable failed assertions. Evidence is incomplete; inspect the run log. No prompt-defect diagnosis is established.';
            }

            if (steps.upload?.outcome === 'failure') {
              detail += '\n\nRegression artifact upload failed; consult the upload step.';
              if (!needsIssue) title = 'Nightly regression artifact upload FAILED';
              needsIssue = true;
            }
            const artifactId = steps.upload?.outputs?.['artifact-id'];
            const artifact = steps.upload?.outcome === 'success' && artifactId
              ? `**Artifact:** [nightly-regression-results](${runUrl}/artifacts/${artifactId}) (30-day retention)`
              : 'No regression artifact was uploaded. Use the run log.';
            const date = new Date().toISOString().slice(0, 10);
            const body = [
              detail,
              '',
              `**Run:** ${runUrl}`,
              artifact,
              '',
              'Triage per workflows/nightly_regression.md. The loop never edits prompts or merges.',
              'Tuned changes require explicit approval of the exact diff; do not auto-apply.',
            ].join('\n');
            await core.summary.addRaw(`### ${title}\n\n${body}\n`).write();
            if (!needsIssue) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${title} — ${date}`,
              body,
              labels: ['regression'],
            });
