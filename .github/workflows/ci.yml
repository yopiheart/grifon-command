name: CI

# Cloud-side verification gate. Mirrors the local build-gate Stop hook
# (.claude/hooks/build-gate.sh) but runs independent of any Claude session,
# so edits from worktrees, web sessions, or a fresh defreezer-wiped machine
# still get gated before they reach main. Status feeds the PR-babysit loop.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # A docs-only push cannot change a build, a test, or a bundle, but it ran the
    # whole pipeline anyway (tsc + vite + 1264 tests + a fresh Playwright browser
    # download) on every NOW.md rewrite. Rewriting NOW.md is the last action of
    # EVERY session. That is a large part of what burned the 2,000 included
    # Actions minutes on 2026-08-19, and the resulting zero budget then blocked
    # every job in this repo for four days.
    #
    # Verified before adding (2026-08-23): no test and no CI gate opens any of
    # these paths at runtime. Every mention of them under tests/ is in a comment.
    # The one .md a gate DOES read is DESIGN.md (design:lint), so it is
    # deliberately absent from this list.
    #
    # On `push` only, on purpose: paths-ignore on `pull_request` leaves a
    # REQUIRED status check stuck on "Expected" forever, which blocks the merge
    # button. Widen this to PRs only after confirming CI is not a required check.
    paths-ignore:
      - 'NOW.md'
      - 'agent_lessons.md'
      - 'workflows/**'
      - 'baselines/**'

# A burst of pushes used to spawn a complete parallel run each, and only the last
# one was ever read. Supersede PR runs. NEVER cancel a push-to-main run, because
# main-status is what opens and closes the ci-red alarm issue, and a cancelled
# alarm reads as a false all-clear (Tier 0b).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    # Uncapped, a hung step billed the 6-hour default against the same
    # 2,000-minute pool that ran out. This job finishes in about three.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No secrets / .env required: env validation is deferred to runtime,
      # and the live Gemini regression (RUN_REGRESSION) + ffmpeg integration
      # suites (RUN_BURNIN) stay off by default so CI never burns quota.
      - name: Build (tsc + vite)
        run: npm run build

      # Fail the build if any of the 5 server-side crown-jewel prompts leaked
      # into the client bundle (must run after build — needs dist/).
      - name: Crown-jewel bundle-leak guard
        run: npm run check:bundle-leak

      # Drift gate for the per-funnel voice lint. It is copied into each funnel
      # (they deploy from their own directory, so a shared import would break the
      # build), and on 2026-08-07 the copies had silently diverged by 11 rules —
      # hiding 14 real violations in LIVE price-page copy. Cheap check, no deps.
      - name: Funnel voice-lint sync
        run: npm run check:voice-sync

      - name: Evaluation prompt copy sync (static, no provider calls)
        run: npm run check:eval-prompts

      # Guard on the guards. The PreToolUse gates (env-warden, tuned-file-gate)
      # are invisible when they work and equally invisible when a regex quietly
      # stops matching. On its first run this harness caught two dead gates: a
      # verb list where `env` matched the `.env` filename itself, and a tuned
      # gate that passed a real prompt edit clean. Pure bash + grep, no deps.
      - name: Permission-gate harness
        run: bash tools/hook_gate_test.sh

      - name: Codex desktop migration contracts
        run: npm run check:codex

      - name: Test (vitest)
        run: npm run test

      - name: Design token lint
        run: npm run design:lint

  # Boot/render smoke (Move 2, scope A). Separate job so its result is
  # distinguishable from the build/unit gate and runs in parallel. Boots the
  # app against dummy Supabase env and verifies the public, pre-auth routes
  # render without crashing — zero Gemini/ElevenLabs calls, no quota burn.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download AND its apt deps ran on every e2e job, uncached.
      # Keyed on the lockfile so a Playwright version bump busts it by itself.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cache hit restores the browser but NOT the system libraries, which live
      # outside ~/.cache. This is the cheap half of the step above.
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Boot/render smoke
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── artifacts ──────────────────────────────────────────────────────────────
  # Makes the anchor guarantee real (Neil, 2026-08-26; loops.md Tier 0d).
  #
  # artifacts/eli5-image-gate.html cites five source line numbers. The builder
  # resolves each from a unique anchor string and throws if one goes missing or
  # ambiguous, so a REBUILD can never silently emit a stale number. Before this
  # job nothing rebuilt it, so a refactor landed green and the published page
  # kept citing the old line forever -- a page confidently wrong about the exact
  # thing its own header comment says a page must never be wrong about.
  #
  # Separate job, same reasoning as e2e above: its result stays distinguishable
  # from the build/unit gate and it runs in parallel.
  #
  # NO `npm ci`. The builder imports only node: builtins plus ./_gates.mjs, so
  # this job is checkout + node + run, in seconds. Do not add an install step
  # without a reason -- the cheapness is why this can gate every PR.
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default shallow checkout is enough ON PURPOSE. An earlier draft of this
      # job needed fetch-depth: 0 because the builder stamped the page with a
      # `git log` date over the cited sources -- which also meant any later
      # commit to producerOrchestrator.ts would flip that stamp and turn this
      # job red on every unrelated PR, paging main-status over a date string.
      # The stamp was dropped instead (see build-eli5-image-gate.mjs), so this
      # now depends on the cited files' CONTENT alone: no history, no blobs.
      # Do not reintroduce a history dependency without rereading that.
      #
      # The same reasoning then had to be applied one level down. Until
      # 2026-08-26 the page printed the resolved line NUMBERS, so the twin
      # tracked line POSITIONS and a blank line inserted above any citation
      # reddened this job with nothing having changed. That mattered more than
      # a noisy PR check: `artifacts` is in main-status's `needs` below, so on a
      # push to main it opens the `ci-red` alarm issue -- the one the Health
      # Watch Routine reads each morning and pushes to Neil's phone. A comment
      # reflow would have paged him. The PR #118 reviewer traced where the red
      # lands; the session that wired this in had it recorded only as a PR-check
      # annoyance.
      #
      # Fixed at the source: the page now prints the ANCHOR STRING and no line
      # number at all. The number is still resolved, because resolving it IS the
      # uniqueness check, and then discarded. Verified 2026-08-26 by inserting a
      # line above producerOrchestrator.ts:1592 -- all three anchors shifted
      # (1592/1613/1635 -> 1593/1614/1636) and the twin's sha256 was unchanged;
      # renaming an anchor still throws ANCHOR LOST. So this job now reddens
      # only on a real anchor loss or a deliberate template/builder edit.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Artifact anchor check
        run: npm run check:artifact-anchors

      - name: Explain a failure
        if: failure()
        run: |
          echo "::error::Artifact anchor check failed -- read the job log for WHICH of"
          echo "its verdicts printed. It distinguishes them on purpose, and this"
          echo "one-line annotation cannot: a builder/gate failure is not a moved"
          echo "call site, and telling you it is would cost you a wrong investigation."
          echo "Reproduce locally:  npm run check:artifact-anchors"
          echo "If it names a moved or missing ANCHOR, reread the code before"
          echo "re-anchoring -- the page may describe behaviour that no longer exists."
          echo ""
          echo "THEN REDEPLOY THE PUBLISHED PAGE. This job guards the committed twin"
          echo "only. The artifact on claude.ai is a SEPARATE copy that nothing here"
          echo "can touch, and it is the one Neil actually opens. Commit the twin and"
          echo "stop, and the build goes green while the published page still cites the"
          echo "old line -- with the green build as the reason nobody looks again."
          echo "Redeploy in place via the Artifact tool's url param (CLAUDE.md has the"
          echo "URL in the artifact registry). Do NOT mint a new URL."

  # Real independent backends verify billing locks and rollback without any
  # application/provider secrets. The verifier owns an ephemeral database only.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: grifon_meter_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --volume "${{ github.workspace }}:/workspace:ro"
          --health-cmd "pg_isready -U postgres -d grifon_meter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: grifon_meter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify finished-ad meter on isolated PostgreSQL
        # Run inside the service so both libpq and the backend see loopback.
        # Host port forwarding makes inet_server_addr() a Docker bridge address.
        # Only the Node executable is copied; fixtures are mounted read-only.
        run: |
          docker cp "$(command -v node)" "${{ job.services.postgres.id }}:/tmp/grifon-node"
          docker exec "${{ job.services.postgres.id }}" /tmp/grifon-node --version
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGDATABASE=grifon_meter_test -w /workspace "${{ job.services.postgres.id }}" /tmp/grifon-node tools/verify-finished-ad-meter.mjs --isolated-test-server

  # ── main-status ────────────────────────────────────────────────────────────
  # The 2026-08-04→08-07 outage was not a detection failure — CI went red
  # immediately and stayed red for three days. It was a READER failure: the
  # signal arrived as ~20 identical GitHub emails, a channel Neil had learned to
  # scroll past. Tier 0b's own rule came out of that ("any new alerting added
  # here must state who reads it and how a real signal stands out"); this job is
  # that rule discharged.
  #
  # It collapses the email firehose into ONE issue that is open exactly while
  # main is red, and closes itself when main goes green. That issue is a durable,
  # queryable red/green bit — which is what the Health Watch v2 Routine reads
  # each morning (workflows/loops.md Tier 6), putting CI status into the ONE
  # channel whose delivery to Neil's phone is CONFIRMED.
  #
  # push-to-main only, on purpose: a red PR is normal and Neil is in-session for
  # it. Paging on PRs would rebuild the noise this job exists to remove.
  main-status:
    if: always() && github.event_name == 'push'
    needs: [verify, e2e, artifacts, database]
    runs-on: ubuntu-latest
    # Serialize so two quick pushes cannot race into two duplicate issues.
    concurrency:
      group: main-status
      cancel-in-progress: false
    steps:
      - name: Sync the main-red alarm issue
        uses: actions/github-script@v7
        with:
          script: |
            // `needs` is an Actions expression context, not a JS binding — these
            // two MUST be interpolated by the runner before the script executes.
            // NB: never write an empty Actions expression in a comment here. The
            // runner scans the whole file for them and does not care that it is
            // inside a JS comment inside a YAML block scalar — an empty one is a
            // parse error that kills the entire workflow (cost one red run,
            // 2026-08-07).
            const verifyResult = '${{ needs.verify.result }}';
            const e2eResult = '${{ needs.e2e.result }}';
            // artifacts joined the alarm 2026-08-26. Leaving it out would have
            // recreated this job's own founding failure in miniature: the signal
            // exists (the job goes red) but reaches nobody, so a merged refactor
            // leaves the published explainer citing a line that moved.
            const artifactsResult = '${{ needs.artifacts.result }}';
            const databaseResult = '${{ needs.database.result }}';
            const red = verifyResult !== 'success' || e2eResult !== 'success'
              || artifactsResult !== 'success' || databaseResult !== 'success';
            const LABEL = 'ci-red';
            const TITLE = 'main is RED — CI failing';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);

            // Self-healing: the label may not exist on a fresh clone of this setup.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: 'B60205',
                description: 'main is red — auto-opened and auto-closed by the CI main-status job',
              });
            }

            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL,
            });
            const existing = open.find(i => !i.pull_request);

            const failed = [
              verifyResult !== 'success' ? `\`verify\` (${verifyResult})` : null,
              e2eResult !== 'success' ? `\`e2e\` (${e2eResult})` : null,
              databaseResult !== 'success' ? `\`database\` (${databaseResult})` : null,
            ].filter(Boolean).join(' + ');

            if (red) {
              const line = `❌ **${sha}** — ${failed} — [run](${runUrl})`;
              if (existing) {
                // Already red. Append to the timeline instead of opening a second
                // issue — how LONG main has been red is the number that matters.
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body: line,
                });
                core.notice(`main still RED — appended to #${existing.number}`);
              } else {
                const { data: created } = await github.rest.issues.create({
                  owner, repo, title: TITLE, labels: [LABEL],
                  body: [
                    `\`main\` is failing CI. This issue stays open until a push to main goes green,`,
                    `then closes itself.`,
                    ``,
                    line,
                    ``,
                    `---`,
                    `**Read by:** the *GRIFON Daily Prod Health Watch v2* Routine (08:00 PHT),`,
                    `which reports a red main as CRITICAL to Neil's phone — the one delivery`,
                    `channel confirmed working (workflows/loops.md Tier 6). The GitHub email for`,
                    `this run is NOT the alert; this issue is.`,
                    ``,
                    `**First triage step:** compare npm major versions before rewriting the`,
                    `lockfile — that was the 3-day outage of 2026-08-04→08-07 (Tier 0b).`,
                  ].join('\n'),
                });
                core.notice(`main went RED — opened #${created.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `✅ **${sha}** — green again — [run](${runUrl})`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
              core.notice(`main is GREEN again — closed #${existing.number}`);
            } else {
              core.info('main is green, no open alarm — nothing to do.');
            }
