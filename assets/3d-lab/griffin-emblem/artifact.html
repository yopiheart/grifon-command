<style>
  :root {
    --canvas: #09090b;
    --gold: #FFCC00;
    --text: #e4e4e7;
    --muted: #a1a1aa;
    --hairline: rgba(63, 63, 70, 0.6);
    --glass: rgba(24, 24, 27, 0.72);
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--canvas); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  .chip {
    position: fixed; z-index: 2;
    background: var(--glass); border: 1px solid var(--hairline);
    border-radius: 10px; padding: 12px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .chip .label {
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--gold);
  }
  #brand { top: 20px; left: 20px; max-width: 300px; }
  #brand h1 { margin: 6px 0 2px; font-size: 17px; font-weight: 650; letter-spacing: 0.01em; }
  #brand p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--muted); }
  #hint {
    right: 20px; bottom: 20px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.08em; color: var(--muted); padding: 10px 14px;
  }
  #hint b { color: var(--text); font-weight: 600; }
  #ref { left: 20px; bottom: 20px; padding: 10px; cursor: pointer; }
  #ref img { display: block; width: 96px; height: auto; border-radius: 6px; transition: width 160ms ease; }
  #ref.open img { width: 260px; }
  #ref .label { display: block; margin-bottom: 6px; }
  #ref:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 640px) { #brand { max-width: 220px; } #ref.open img { width: 180px; } }
</style>
