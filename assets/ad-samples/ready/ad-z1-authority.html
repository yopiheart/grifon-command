<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--gold:#FFCC00;--ground:#09090B;--w:#FFF;--z3:#D4D4D8;
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',monospace;
    --serif:'Instrument Serif',Georgia,serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ground);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:1080px;height:1350px;background:var(--ground);overflow:hidden}
  img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
  .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(9,9,11,.96) 18%,rgba(9,9,11,.55) 40%,rgba(9,9,11,.08) 60%,transparent 75%)}
  .pad{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 60px 64px}
  .lockup{display:flex;align-items:center;gap:18px}
  .lockup img{height:56px;width:56px;border-radius:50%;object-fit:cover;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
  .lockup span{font-weight:600;color:var(--w);font-size:30px;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .spacer{flex:1}
  .hook{font-family:var(--mono);font-weight:600;font-size:25px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);line-height:1.5;text-shadow:0 2px 10px rgba(0,0,0,.7)}
  .hl{font-weight:700;font-size:66px;line-height:1.1;color:var(--w);letter-spacing:-.025em;margin:20px 0 36px;max-width:22ch;text-shadow:0 3px 18px rgba(0,0,0,.65)}
  .acc{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--gold);letter-spacing:0}
  .cta{align-self:flex-start;display:inline-flex;align-items:center;gap:16px;background:var(--gold);color:#0A0A0A;
    font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.12em;
    padding:28px 48px;border-radius:999px;box-shadow:0 0 44px rgba(255,204,0,.45)}
  .cta svg{width:30px;height:30px}
</style></head><body>
<div class="ad">
  <img class="bg" src="zam-real-plate.png" alt="">
  <div class="scrim"></div>
  <div class="pad">
    <div class="lockup"><img src="logo-badge.png" alt=""><span style="font-weight:900;font-style:italic;letter-spacing:-.03em">GRIFON</span></div>
    <div class="spacer"></div>
    <div class="hook">Para sa negosyanteng laging puyat gumawa ng ads</div>
    <div class="hl">Buong gabi para sa <span class="acc">isang</span> ad. Alam ko yan, dati akong ganyan.</div>
    <a class="cta">Alamin ang system <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</div>
</body></html>
