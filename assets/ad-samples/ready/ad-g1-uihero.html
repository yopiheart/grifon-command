<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--gold:#FFCC00;--ground:#09090B;--w:#FFF;--z3:#D4D4D8;--z4:#A1A1AA;--z5:#71717A;
    --line:rgba(255,255,255,.12);--panel:rgba(24,24,27,.86);
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono','Cascadia Code',monospace;
    --serif:'Instrument Serif',Georgia,serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ground);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:1080px;height:1350px;background:var(--ground);overflow:hidden}
  .spot{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 20%,rgba(255,204,0,.14),transparent 60%)}
  .pad{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px 64px 60px}
  .hook{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);text-align:center;line-height:1.5}
  .hl{font-weight:700;font-size:60px;line-height:1.14;color:var(--w);letter-spacing:-.025em;text-align:center;margin:18px auto 40px;max-width:21ch}
  .acc{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--gold);letter-spacing:0}
  .glass{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
  .label{font-family:var(--mono);font-weight:600;font-size:19px;letter-spacing:.15em;text-transform:uppercase;color:var(--z5);margin-bottom:18px}
  .field{display:flex;align-items:center;gap:14px;background:#0d0d0f;border:1px solid var(--line);border-radius:20px;padding:26px 28px;font-size:29px;color:var(--z3)}
  .cur{width:3px;height:34px;background:var(--gold)}
  .genbtn{margin-top:20px;width:100%;background:var(--gold);color:#0A0A0A;font-weight:900;font-size:25px;text-transform:uppercase;letter-spacing:.12em;border-radius:999px;padding:24px;text-align:center;box-shadow:0 0 34px rgba(255,204,0,.32)}
  .arrow{display:grid;place-items:center;color:var(--gold);font-size:38px;margin:18px 0 14px;font-weight:700}
  .out{display:flex;gap:16px}
  .frame{flex:1;aspect-ratio:9/13;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,#1c1c20,#0f0f11);position:relative;overflow:hidden}
  .frame .pn{position:absolute;top:12px;left:14px;font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.9)}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .frame .dk{position:absolute;inset:0;z-index:2;background:linear-gradient(to bottom,rgba(9,9,11,.55),transparent 40%)}
  .script{padding:52px 18px 14px;display:flex;flex-direction:column;gap:11px}
  .sline{height:11px;border-radius:6px;background:rgba(255,255,255,.16)}
  .sline.g{background:rgba(255,204,0,.55);width:62%}
  .sline.w1{width:92%}.sline.w2{width:78%}.sline.w3{width:85%}.sline.w4{width:58%}.sline.w5{width:88%}.sline.w6{width:70%}
  .stxt{font-family:var(--mono);font-weight:600;font-size:15px;line-height:1.55;color:var(--z4);margin-top:6px}
  .board{position:absolute;inset:0;padding:50px 14px 14px;display:grid;grid-template-rows:1fr 1fr 1fr;gap:10px;z-index:1}
  .cell{border-radius:10px;overflow:hidden;position:relative;border:1px solid var(--line)}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell:nth-child(1) img{object-position:50% 8%}
  .cell:nth-child(2) img{object-position:50% 55%}
  .cell:nth-child(3) img{object-position:50% 95%}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .lockup{display:flex;align-items:center;gap:16px}
  .lockup img{height:48px;width:auto}
  .lockup span{font-weight:700;color:var(--w);font-size:28px;letter-spacing:.02em}
  .cta{display:inline-flex;align-items:center;background:var(--gold);color:#0A0A0A;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.12em;padding:24px 42px;border-radius:999px;box-shadow:0 0 40px rgba(255,204,0,.42)}
</style></head><body>
<div class="ad">
  <div class="spot"></div>
  <div class="pad">
    <div class="hook">Ang unang all-in-one AI marketing sa PH</div>
    <div class="hl">I-type ang business niche mo. Get your first <span class="acc">video ad!</span></div>
    <div class="glass">
      <div class="label">Director AI &middot; brief</div>
      <div class="field">Milk tea shop sa Cebu, bagong ube flavor<span class="cur"></span></div>
      <div class="genbtn">Gumawa ng ad</div>
      <div class="arrow">&#8595;</div>
      <div class="out">
        <div class="frame">
          <span class="pn">Script</span>
          <div class="script">
            <div class="sline g"></div>
            <div class="sline w1"></div><div class="sline w2"></div><div class="sline w3"></div>
            <div class="stxt">Bagong UBE overload. Cebu, para sa'yo 'to.</div>
            <div class="sline w4"></div><div class="sline w5"></div><div class="sline w6"></div>
          </div>
        </div>
        <div class="frame">
          <span class="pn">Storyboard</span>
          <div class="board">
            <div class="cell"><img src="ube-frame.png" alt=""></div>
            <div class="cell"><img src="ube-frame.png" alt=""></div>
            <div class="cell"><img src="ube-frame.png" alt=""></div>
          </div>
        </div>
        <div class="frame">
          <span class="pn">Visual</span>
          <img src="ube-frame.png" alt="">
          <div class="dk"></div>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="lockup"><img src="logo.png" alt=""><span>GRIFON AI</span></div>
      <a class="cta">Simulan nang libre</a>
    </div>
  </div>
</div>
</body></html>
