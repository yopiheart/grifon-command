<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--gold:#FFCC00;--ground:#09090B;--w:#FFF;--z3:#D4D4D8;--z4:#A1A1AA;--z5:#71717A;
    --line:rgba(255,255,255,.12);
    --sans:'Inter','Segoe UI',system-ui,sans-serif;
    --mono:'JetBrains Mono',monospace;
    --serif:'Instrument Serif',Georgia,serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ground);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:1080px;height:1350px;background:var(--ground);overflow:hidden}
  .spot{position:absolute;inset:0;background:radial-gradient(100% 60% at 50% 30%,rgba(255,204,0,.09),transparent 60%)}
  .pad{position:absolute;inset:0;display:flex;flex-direction:column;padding:72px 64px 60px;text-align:center;align-items:center}
  .hook{font-family:var(--mono);font-weight:600;font-size:24px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);line-height:1.5}
  .mid{display:flex;flex-direction:column;align-items:center;margin:auto 0}
  .stack{display:flex;flex-direction:column;gap:40px;margin:0 0 56px}
  .stat{font-weight:700;font-size:104px;line-height:1;color:var(--w);letter-spacing:-.025em}
  .stat .n{color:var(--gold);font-variant-numeric:tabular-nums}
  .stat.dim{font-size:92px}
  .divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,204,0,.6),transparent);margin:0 auto}
  .kicker{font-family:var(--serif);font-style:italic;font-weight:400;font-size:52px;color:var(--z3)}
  .kicker b{color:var(--gold);font-style:italic;font-weight:400}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;width:100%}
  .lockup{display:flex;align-items:center;gap:16px}
  .lockup .gm{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;background:transparent}.lockup .gm img{height:74%;width:auto}
  .lockup span{font-weight:700;color:var(--w);font-size:28px;letter-spacing:.02em}
  .cta{display:inline-flex;align-items:center;background:var(--gold);color:#0A0A0A;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.12em;padding:24px 42px;border-radius:999px;box-shadow:0 0 40px rgba(255,204,0,.42)}
</style></head><body>
<div class="ad">
  <div class="spot"></div>
  <div class="pad">
    <div class="hook">Isang brief lang ang kailangan</div>
    <div class="mid">
      <div class="stack">
        <div class="stat"><span class="n">1</span> brief.</div>
        <div class="divider"></div>
        <div class="stat"><span class="n">7</span> scenes.</div>
        <div class="divider"></div>
        <div class="stat"><span class="n">2</span> wika.</div>
        <div class="divider"></div>
        <div class="stat"><span class="n">1</span> buong video ad.</div>
      </div>
      <div class="kicker">Ganyan <b>kabilis.</b></div>
    </div>
    <div class="foot">
      <div class="lockup"><span class="gm"><img src="logo.png" alt=""></span><span style="font-weight:900;font-style:italic;letter-spacing:-.03em">GRIFON</span></div>
      <a class="cta">Simulan nang libre</a>
    </div>
  </div>
</div>
</body></html>
