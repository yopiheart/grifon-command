<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root{--gold:#FFCC00;--ink:#0A0A0A;--sans:'Inter','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--serif:'Instrument Serif',Georgia,serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1350px;overflow:hidden;background:var(--gold);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:1080px;height:1350px;background:var(--gold);overflow:hidden}
  .pad{position:absolute;inset:0;display:flex;flex-direction:column;padding:64px;align-items:flex-start}
  .badge{display:flex;align-items:center;gap:16px}
  .chipdark{width:72px;height:72px;border-radius:20px;background:var(--ink);display:grid;place-items:center}
  .chipdark img{height:44px;width:auto}
  .badge span{font-weight:700;color:var(--ink);font-size:28px;letter-spacing:.02em}
  .spacer{flex:1}
  .hl{font-weight:900;font-size:120px;line-height:.98;color:var(--ink);letter-spacing:-.03em;text-transform:uppercase;max-width:9ch}
  .sub{font-size:36px;line-height:1.45;color:rgba(10,10,10,.75);margin:36px 0 0;max-width:26ch;font-weight:600}
  .sub b{color:var(--ink)}
  .cta{margin-top:44px;display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:var(--gold);font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.12em;padding:28px 48px;border-radius:999px}
  .cta svg{width:30px;height:30px}
</style></head><body>
<div class="ad">
  <div class="pad">
    <div class="badge"><span class="chipdark"><img src="logo.png" alt=""></span><span style="font-weight:900;font-style:italic;letter-spacing:-.03em">GRIFON</span></div>
    <div class="spacer"></div>
    <div class="hl">Sorry sa mga agency.</div>
    <p class="sub">Kaya na ng negosyante ang sariling ads. Script, storyboard, video. <b>Isang brief lang.</b></p>
    <a class="cta">Subukan nang libre <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <div class="spacer"></div>
  </div>
</div>
</body></html>
