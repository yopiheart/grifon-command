<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private full-film reference review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f2f1ea;font:16px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#b4b4bb;line-height:1.5}.labels{display:grid;grid-template-columns:1fr 1fr;font-weight:700;margin-bottom:8px;gap:16px}.labels span:last-child{color:#fc0}video{display:block;width:100%;height:auto;background:#000;border:1px solid #333}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,select,a{min-height:44px;min-width:44px;padding:10px 14px;border:1px solid #444;border-radius:4px;color:#f2f1ea;background:#18181b;font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fc0}input{width:100%;min-height:44px;accent-color:#fc0}output{font-variant-numeric:tabular-nums;display:block;margin-top:12px}.small{font-size:13px}@media(max-width:600px){main{padding:16px}h1{font-size:20px}.labels{font-size:13px}}</style>
<main><h1>Private full-film reference review</h1><p>Both halves are encoded into one silent video at the original frame rate. This preview contains the reference and stays private.</p><div class="labels"><span>REFERENCE</span><span>GRIFON</span></div><video id="pair" src="/paired-full.mp4" muted playsinline preload="auto"></video><output id="clock">Loading…</output><input id="seek" type="range" min="0" max="931" step="1" value="0" aria-label="Frame"><nav><button id="previous">Previous frame</button><button id="play">Play</button><button id="restart">Restart</button><button id="next">Next frame</button><label>Speed <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><span>932 native frames / silent visual review</span></nav><p class="small" id="binding"></p></main>
<script>
const video=document.querySelector('#pair'),seek=document.querySelector('#seek'),clock=document.querySelector('#clock'),play=document.querySelector('#play'),fps=30000/1001;
let presentedFrame=null;
function update(){const frame=Math.min(931,Math.max(0,Math.round(video.currentTime*fps)));seek.value=frame;clock.value=`Clock frame ${frame} / 931 · ${video.currentTime.toFixed(4)}s${presentedFrame===null?'':` · presented frame ${presentedFrame}`}`;play.textContent=video.paused?'Play':'Pause';}
function setFrame(frame){video.pause();video.currentTime=Math.min(931,Math.max(0,frame))/fps;update();}
play.onclick=()=>{if(video.paused){if(video.ended)video.currentTime=0;video.play().catch(error=>{clock.value=error.message;});}else video.pause();};
document.querySelector('#restart').onclick=()=>setFrame(0);document.querySelector('#previous').onclick=()=>setFrame(Number(seek.value)-1);document.querySelector('#next').onclick=()=>setFrame(Number(seek.value)+1);seek.oninput=()=>setFrame(Number(seek.value));document.querySelector('#speed').onchange=event=>{video.playbackRate=Number(event.target.value);};
for(const name of ['loadeddata','seeked','timeupdate','play','pause','ended'])video.addEventListener(name,update);
if(video.requestVideoFrameCallback){const observe=(_,metadata)=>{presentedFrame=Math.round(metadata.mediaTime*fps);update();video.requestVideoFrameCallback(observe);};video.requestVideoFrameCallback(observe);}
fetch('/paired-full-receipt.json').then(r=>r.json()).then(r=>{document.querySelector('#binding').textContent=`Film SHA-256: ${r.inputs.film.sha256}. Pair SHA-256: ${r.output.sha256}.`;}).catch(error=>{document.querySelector('#binding').textContent=error.message;});
</script></html>
