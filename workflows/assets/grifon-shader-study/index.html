<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grifon shader study</title>
  <style>
    @font-face{font-family:Inter;src:url('./assets/inter-variable.ttf') format('truetype');font-weight:100 900;font-display:block}
    @font-face{font-family:InterBlack;src:url('./assets/inter-900.ttf') format('truetype');font-weight:900;font-display:block}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090B}
    body{font-family:Inter,Arial,sans-serif;color:#fff}
    #root{position:relative;isolation:isolate;width:1920px;height:1080px;overflow:hidden;background:#09090B;transform-origin:top left}
    .scene{position:absolute;inset:0;visibility:hidden;pointer-events:none}
    .shader-layer{position:absolute;display:block;pointer-events:none;opacity:0}
    #shader-background{inset:0;width:1920px;height:1080px;z-index:0}
    #material-background{position:absolute;inset:0;z-index:1;pointer-events:none;will-change:opacity}
    .background-haze{position:absolute;inset:-120px;background:radial-gradient(ellipse at 78% 49%,rgba(255,204,0,.08),transparent 48%),radial-gradient(ellipse at 60% 108%,rgba(255,255,255,.035),transparent 52%)}
    .background-arc{position:absolute;left:420px;top:480px;width:2040px;height:1130px;border-radius:50%;border:1px solid rgba(255,204,0,.13);transform:rotate(-23deg);opacity:.65}
    .background-arc.secondary{left:470px;top:528px;border-color:rgba(255,255,255,.06)}
    .edge-grade{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(90deg,rgba(9,9,11,.26),transparent 37%,transparent 82%,rgba(9,9,11,.28)),linear-gradient(0deg,rgba(9,9,11,.34),transparent 25%,transparent 78%,rgba(9,9,11,.18))}
    #orb-scene{z-index:2}
    #orb-world{position:absolute;left:835px;top:60px;width:960px;height:960px;transform-origin:50% 50%}
    .orb-aura{position:absolute;inset:55px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.10) 12%,rgba(255,204,0,.038) 49%,transparent 69%);filter:blur(46px);transform:scale(1.25)}
    #orb-material{position:absolute;inset:56px;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 34% 20%,rgba(255,255,255,.55) 0%,rgba(255,255,255,.08) 15%,transparent 33%),radial-gradient(ellipse at 69% 79%,rgba(255,204,0,.70) 0%,rgba(255,204,0,.09) 27%,transparent 49%),radial-gradient(ellipse at 72% 36%,#29251C 0%,#181819 33%,#0D0D0F 66%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),inset -44px -32px 90px rgba(9,9,11,.8)}
    #orb-material:before{content:'';position:absolute;left:-12%;top:27%;width:124%;height:43%;border-radius:50%;border-top:24px solid rgba(255,204,0,.74);border-bottom:1px solid rgba(255,255,255,.15);transform:rotate(-35deg);filter:blur(.6px)}
    #orb-material:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 4%,rgba(255,255,255,.18),transparent 45%),linear-gradient(135deg,transparent 46%,rgba(9,9,11,.80) 78%)}
    #shader-orb{inset:0;width:960px;height:960px;z-index:2;border-radius:50%}
    .orb-rim{position:absolute;inset:56px;border:1px solid rgba(255,255,255,.10);border-radius:50%;z-index:3;opacity:.4}
    #orb-glint{position:absolute;left:380px;top:105px;width:320px;height:16px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),rgba(255,204,0,.65),transparent);filter:blur(8px);z-index:4;transform:rotate(-24deg)}
    #opening-copy{position:absolute;left:182px;top:425px;width:1130px;margin:0;z-index:5;font-family:InterBlack,Inter,Arial,sans-serif;font-size:164px;font-weight:900;line-height:1.05;letter-spacing:-10px;white-space:nowrap;transform-origin:0 50%;will-change:opacity}
    #opening-rule{position:absolute;left:192px;top:643px;width:104px;height:3px;background:#FFCC00;transform-origin:left center;z-index:5}
    #glass-scene{z-index:3}
    #glass-field{position:absolute;left:115px;top:615px;width:1690px;height:140px;overflow:hidden;filter:blur(24px);opacity:.55;transform:rotate(-11deg)}
    .field-band{position:absolute;left:-10%;top:25px;width:120%;height:70px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,204,0,.22) 28%,rgba(255,255,255,.21) 52%,rgba(255,204,0,.38) 73%,transparent)}
    #direction-copy{position:absolute;left:260px;top:194px;width:1400px;margin:0;z-index:3;font-size:84px;font-weight:600;line-height:1.08;letter-spacing:-4.8px;transform-origin:left center}
    #direction-copy .direction-line{display:block;white-space:nowrap}
    #direction-copy .direction-line:last-child{color:#FFCC00}
    #glass-card{position:absolute;left:260px;top:510px;width:1400px;height:340px;border-radius:38px;transform-origin:center;transform-style:preserve-3d;overflow:hidden;z-index:2;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.02) 49%,rgba(255,204,0,.028));border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,204,0,.12)}
    #glass-card .card-depth{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 16% 0,rgba(255,255,255,.06),transparent 45%),linear-gradient(180deg,transparent,rgba(9,9,11,.32));z-index:1}
    #shader-glass{inset:0;width:1400px;height:340px;border-radius:38px;z-index:0}
    #card-sheen{position:absolute;left:-680px;top:-220px;width:550px;height:850px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.022) 22%,rgba(255,255,255,.10) 49%,rgba(255,204,0,.055) 60%,transparent 84%);transform:rotate(28deg);z-index:2;pointer-events:none}
    #card-top-line{position:absolute;left:26px;right:26px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),rgba(255,204,0,.30),transparent);z-index:5}
    #workflow-steps{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);z-index:4}
    .workflow-step{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:0 54px;gap:34px}
    .workflow-step+.workflow-step:before{content:'';position:absolute;left:0;top:69px;bottom:69px;width:1px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.18),transparent)}
    .step-title{margin:0;font-size:49px;font-weight:600;letter-spacing:-1.5px;line-height:1.1;white-space:nowrap}
    .step-graphic{position:relative;height:36px;width:62px;color:#FFCC00}
    .research-graphic i{position:absolute;width:10px;height:10px;border:1px solid currentColor;border-radius:50%}
    .research-graphic i:nth-child(1){left:0;top:14px;opacity:.45}.research-graphic i:nth-child(2){left:25px;top:0}.research-graphic i:nth-child(3){left:50px;top:22px;opacity:.7}
    .research-graphic:after{content:'';position:absolute;left:7px;top:16px;width:45px;height:1px;background:currentColor;transform:rotate(14deg);opacity:.35}
    .script-graphic i{position:absolute;left:0;height:2px;border-radius:2px;background:currentColor}
    .script-graphic i:nth-child(1){top:2px;width:60px}.script-graphic i:nth-child(2){top:16px;width:44px;opacity:.65}.script-graphic i:nth-child(3){top:30px;width:53px;opacity:.35}
    .storyboard-graphic{display:flex;gap:7px;padding-top:2px}.storyboard-graphic i{width:18px;height:31px;border:1px solid currentColor;border-radius:3px}.storyboard-graphic i:nth-child(2){opacity:.65}.storyboard-graphic i:nth-child(3){opacity:.35}
    #finish-scene{z-index:4}
    #finish-aura{position:absolute;left:370px;top:310px;width:1180px;height:530px;background:radial-gradient(ellipse at 50% 50%,rgba(255,204,0,.055),transparent 66%);filter:blur(45px);pointer-events:none}
    #finish-light{position:absolute;left:200px;top:520px;width:1520px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,204,0,.17),rgba(255,255,255,.21),rgba(255,204,0,.17),transparent);transform-origin:center;pointer-events:none}
    #brand{position:absolute;left:0;top:410px;width:1920px;display:flex;align-items:center;flex-direction:column;transform-origin:50% 50%;z-index:3}
    #brand-lockup{display:flex;align-items:center;justify-content:center;gap:29px;height:166px}
    #mark-ring{height:138px;width:138px;border:1.5px solid #FFCC00;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:transparent}
    #mark-ring img{width:74%;height:74%;object-fit:contain;display:block}
    #brand-word{font-family:InterBlack,Inter,Arial,sans-serif;font-size:136px;font-weight:900;font-style:italic;line-height:1;letter-spacing:-8px;padding-right:13px;color:#fff}
    #brand-url{margin:22px 0 0;font-size:30px;font-weight:400;line-height:1.3;letter-spacing:.3px;color:#D4D4D8}
    #transition-light{position:absolute;left:-700px;top:-300px;width:580px;height:1680px;transform:rotate(-19deg);background:linear-gradient(90deg,transparent,rgba(255,204,0,.045) 28%,rgba(255,255,255,.22) 48%,rgba(255,204,0,.13) 57%,transparent 85%);filter:blur(24px);z-index:6;pointer-events:none}
    #end-fade{position:absolute;inset:0;background:#09090B;z-index:10;pointer-events:none;opacity:0}
    #root[data-mode="after"] #shader-background{opacity:.34}
    #root[data-mode="after"] #shader-orb,#root[data-mode="after"] #shader-glass{opacity:1}
    #root[data-mode="after"] #orb-material{opacity:0}
    #root[data-mode="after"] #glass-card{background:rgba(9,9,11,.10)}
    @media (prefers-reduced-transparency:reduce),(prefers-contrast:more){#glass-card{background:#18181B}#shader-glass,#card-sheen{visibility:hidden}.step-title{color:#fff}}
  </style>
</head>
<body>
  <main id="root" data-mode="before" aria-label="Original Grifon abstract motion study">
    <canvas id="shader-background" class="shader-layer" width="1920" height="1080" aria-hidden="true"></canvas>
    <div id="material-background" aria-hidden="true"><div class="background-haze"></div><div class="background-arc"></div><div class="background-arc secondary"></div></div>
    <section id="orb-scene" class="scene">
      <div id="orb-world" aria-hidden="true"><div class="orb-aura"></div><div id="orb-material"></div><canvas id="shader-orb" class="shader-layer" width="960" height="960"></canvas><div class="orb-rim"></div><div id="orb-glint"></div></div>
      <h1 id="opening-copy"></h1><div id="opening-rule" aria-hidden="true"></div>
    </section>
    <section id="glass-scene" class="scene">
      <div id="glass-field" aria-hidden="true"><div class="field-band"></div></div>
      <h2 id="direction-copy"></h2>
      <div id="glass-card">
        <canvas id="shader-glass" class="shader-layer" width="1400" height="340" aria-hidden="true"></canvas><div class="card-depth" aria-hidden="true"></div><div id="card-sheen" aria-hidden="true"></div><div id="card-top-line" aria-hidden="true"></div>
        <div id="workflow-steps">
          <div class="workflow-step"><div class="step-graphic research-graphic" aria-hidden="true"><i></i><i></i><i></i></div><p class="step-title"></p></div>
          <div class="workflow-step"><div class="step-graphic script-graphic" aria-hidden="true"><i></i><i></i><i></i></div><p class="step-title"></p></div>
          <div class="workflow-step"><div class="step-graphic storyboard-graphic" aria-hidden="true"><i></i><i></i><i></i></div><p class="step-title"></p></div>
        </div>
      </div>
    </section>
    <section id="finish-scene" class="scene">
      <div id="finish-aura" aria-hidden="true"></div><div id="finish-light" aria-hidden="true"></div>
      <div id="brand"><div id="brand-lockup"><div id="mark-ring"><img id="brand-mark" src="./assets/logo.png" alt=""></div><div id="brand-word"></div></div><p id="brand-url"></p></div>
    </section>
    <div class="edge-grade" aria-hidden="true"></div><div id="transition-light" aria-hidden="true"></div><div id="end-fade" aria-hidden="true"></div>
  </main>
  <script type="module" src="./composition.js"></script>
</body>
</html>
