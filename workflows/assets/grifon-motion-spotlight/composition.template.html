<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Grifon / Spotlight</title>
<style>
@font-face{font-family:Inter;src:url('{{INTER}}');font-weight:900;font-display:block}
@font-face{font-family:Mono;src:url('{{MONO}}');font-weight:600;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090b}
#film{position:relative;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:#09090b;color:#fff;font-family:Inter,sans-serif;font-weight:900;isolation:isolate}
.stage{position:absolute;inset:0;perspective:1800px}.light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,#ffcc001b,transparent 58%)}
.display{word-spacing:.13em}
#rays{position:absolute;inset:0;pointer-events:none}.display{margin:0;line-height:1;letter-spacing:-.065em;background:linear-gradient(180deg,#fafafa 10%,#a1a1aa);background-clip:text;-webkit-background-clip:text;color:transparent}
.opening-title{position:absolute;top:210px;left:90px;width:900px;font-size:146px;z-index:3}
.product-window{position:absolute;left:210px;top:595px;width:660px;height:1173px;overflow:hidden;border-radius:28px;border:1px solid #ffffff1a;transform-origin:center;box-shadow:0 50px 120px #00000060}
.product-window img{height:100%;width:100%;object-fit:cover;transform-origin:50% 73%}.sweep{position:absolute;top:-50%;left:-75%;height:200%;width:45%;background:linear-gradient(90deg,transparent,#ffffff55,transparent);transform:rotate(20deg);pointer-events:none}
.proof-title{position:absolute;left:85px;right:85px;top:90px;font-size:67px;line-height:1.05;letter-spacing:-.045em}
.proof-window{position:absolute;left:108px;top:230px;width:864px;height:1536px;border-radius:24px;overflow:hidden;background:#18181b;border:1px solid #ffffff1a;transform-origin:center}
.proof-window img,.proof-window video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.proof-window .end-poster{opacity:0;z-index:3}
.sample-label{position:absolute;left:0;right:0;top:1820px;margin:0;text-align:center;font-family:Mono,monospace;font-size:40px;font-weight:600;letter-spacing:1.5px;color:#d4d4d8}
.payoff{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:35px;text-align:center}
.lead{font-size:102px}.payoff-title{font-size:114px;letter-spacing:-.06em;line-height:1.04;width:970px}.gold-line{width:240px;height:3px;background:#ffcc00;margin-top:22px}
.closing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:52px}
.mark{display:flex;align-items:center;flex-direction:column;gap:40px}.badge{width:290px;height:290px;border-radius:50%;border:2px solid #ffcc00;display:flex;align-items:center;justify-content:center;background:transparent;flex:none}
.badge img{height:74%;width:auto;object-fit:contain}.brand{font-size:142px;font-style:italic;letter-spacing:-.06em;line-height:1;margin:0}.url{font-family:Mono,monospace;font-weight:600;font-size:49px;letter-spacing:6px;color:#d4d4d8;margin:0}
.landscape .opening-title{top:340px;left:130px;width:870px;font-size:162px}.landscape .product-window{left:1190px;top:51px;width:550px;height:978px}
.landscape .proof-title{left:130px;right:auto;top:320px;width:900px;font-size:145px;line-height:1.02;letter-spacing:-.065em}.landscape .proof-window{left:1215px;top:64px;width:535px;height:951px}
.landscape .sample-label{left:135px;right:auto;top:735px;font-size:60px;width:930px;text-align:left;letter-spacing:1px}
.landscape .lead{font-size:140px}.landscape .payoff-title{font-size:186px;width:1700px}.landscape .payoff{gap:20px}.landscape .closing{gap:64px}.landscape .mark{flex-direction:row;gap:56px}.landscape .badge{width:260px;height:260px}.landscape .brand{font-size:170px}.landscape .url{font-size:66px}
</style></head><body><main id="film" class="{{FORMAT}}" data-composition-id="main" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="25" data-start="0" data-fps="24">
<div class="light"></div><canvas id="rays" width="{{WIDTH}}" height="{{HEIGHT}}"></canvas>
<section id="intro" class="stage"><h1 class="display opening-title">{{OPENING}}</h1><div class="product-window"><img src="media/product.jpg" alt="Hiraya Glow product from the sample ad"><div class="sweep"></div></div></section>
<section id="proof" class="stage"><h2 class="display proof-title">{{PROOF}}</h2><div class="proof-window"><img src="media/presenter.jpg" alt=""><img class="end-poster" src="media/product-end.jpg" alt=""><video id="sample" class="clip" src="media/sample.mp4" poster="media/presenter.jpg" muted playsinline data-start="7.5" data-duration="9" data-track-index="2"></video></div><p class="sample-label">{{SAMPLE}}</p></section>
<section id="statement" class="stage"><div class="payoff"><p class="display lead">{{LEAD}}</p><h2 class="display payoff-title">{{PAYOFF}}</h2><div class="gold-line"></div></div></section>
<section id="end" class="stage"><div class="closing"><div class="mark"><div class="badge"><img src="{{LOGO}}" alt="Grifon"></div><p class="brand">{{BRAND}}</p></div><p class="url">{{URL}}</p></div></section>
</main><script src="vendor/gsap.min.js"></script><script>
window.__timelines={};const wide=document.querySelector('#film').classList.contains('landscape');
const canvas=document.querySelector('#rays'),ctx=canvas.getContext('2d'),W={{WIDTH}},H={{HEIGHT}},clock={t:0};
const clamp=x=>Math.max(0,Math.min(1,x));
function draw(t){
 ctx.clearRect(0,0,W,H);const reveal=clamp(t/1.5),proof=clamp((t-6.5)/1),end=clamp((t-20)/2);
 const energy=(1-proof)*.9+clamp((t-16.5)/1)*(1-end)*.8+.12;
 const cx=W*(wide?.72:.5),cy=H*(wide?.56:.66),r=Math.min(W,H)*(.50+.08*Math.sin(t*.23));
 for(let i=0;i<4;i++){ctx.save();ctx.translate(cx,cy);ctx.rotate(-.3+t*.055);ctx.scale(1,.34+i*.08);ctx.beginPath();ctx.strokeStyle=`rgba(255,204,0,${reveal*energy*(.18-i*.032)})`;ctx.lineWidth=i===0?2:1;ctx.arc(0,0,r+i*70,-2.3+t*.14,.6+t*.14);ctx.stroke();ctx.restore();}
 const g=ctx.createRadialGradient(W/2,H*.52,0,W/2,H*.52,Math.min(W,H)*.6);g.addColorStop(0,`rgba(255,204,0,${.065*energy})`);g.addColorStop(1,'rgba(255,204,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
const tl=gsap.timeline({paused:true});tl.to(clock,{t:25,duration:25,ease:'none',onUpdate:()=>draw(clock.t)},0);
tl.set(['#proof','#statement','#end'],{opacity:0},0);
tl.fromTo('.product-window',{scale:1.18,rotationY:wide?-18:12,rotationZ:wide?7:-6,clipPath:'inset(4% 38% 4% 38% round 120px)'},{scale:1,rotationY:0,rotationZ:0,clipPath:'inset(0% 0% 0% 0% round 28px)',duration:2.25,ease:'power3.inOut'},0);
tl.fromTo('.product-window img',{scale:1.85},{scale:1,duration:3.2,ease:'power3.out'},0);
tl.fromTo('.opening-title',{opacity:0,y:55},{opacity:1,y:0,duration:.9,ease:'power3.out'},.4);
tl.fromTo('.sweep',{x:0},{x:1450,duration:2,ease:'power2.inOut'},.45);
tl.to('.product-window',{y:-18,rotationY:wide?-5:3,duration:2.5,ease:'sine.inOut'},3.25);
tl.to('.opening-title',{opacity:0,y:-45,duration:.5},6.05);
tl.to('.product-window',{scale:.8,rotationY:wide?30:-25,x:wide?120:-80,opacity:0,duration:.8,ease:'power3.inOut'},6.2);
tl.set('#proof',{opacity:1},6.7);
tl.fromTo('.proof-window',{scale:.84,rotationY:wide?-14:8,opacity:0,y:60},{scale:1,rotationY:0,opacity:1,y:0,duration:.8,ease:'power3.out'},6.7);
tl.fromTo('.proof-title',{opacity:0,y:35},{opacity:1,y:0,duration:.65,ease:'power3.out'},6.75);
tl.fromTo('.sample-label',{opacity:0},{opacity:1,duration:.4},7.0);
tl.set('#intro',{opacity:0},7.05);
// Clean 270-frame sample runs at normal speed, 7.5 -> 16.5; no hidden workflow or instant-generation claim.
tl.set('.end-poster',{opacity:1},16.5);
tl.to(['.proof-title','.sample-label'],{opacity:0,y:-25,duration:.45},16.55);
tl.to('.proof-window',{scale:.75,rotationY:wide?24:-20,x:wide?130:0,opacity:0,duration:.8,ease:'power3.in'},16.55);
tl.set('#statement',{opacity:1},16.9);
tl.fromTo('.lead',{opacity:0,y:40},{opacity:1,y:0,duration:.65,ease:'power3.out'},16.95);
tl.fromTo('.payoff-title',{opacity:0,y:70,scale:.92},{opacity:1,y:0,scale:1,duration:.8,ease:'power3.out'},17.15);
tl.fromTo('.gold-line',{scaleX:0},{scaleX:1,duration:1,ease:'power3.inOut'},17.4);
tl.set('#proof',{opacity:0},17.4);
tl.to('.payoff',{scale:1.04,duration:2.1,ease:'none'},18);
tl.to('.payoff',{opacity:0,y:-35,duration:.6},20.15);
tl.set('#end',{opacity:1},20.55);
tl.fromTo('.closing',{scale:.87,opacity:0,y:45},{scale:1,opacity:1,y:0,duration:1.05,ease:'power3.out'},20.55);
tl.set('#statement',{opacity:0},20.9);tl.to('.closing',{y:-8,duration:2.2,ease:'sine.inOut'},22);
window.__timelines.main=tl;draw(0);
</script></body></html>
