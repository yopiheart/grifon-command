</main><script src="vendor/gsap.min.js"></script><script>
window.__timelines={};
const wide=document.querySelector('#film').classList.contains('landscape');
const W=1920,H=1080,canvas=document.getElementById('particles'),ctx=canvas.getContext('2d');
const clock={t:0};
const fract=x=>x-Math.floor(x),seed=i=>fract(Math.sin(i*127.1+311.7)*43758.5453);
const smooth=(a,b,t)=>{const x=Math.max(0,Math.min(1,(t-a)/(b-a)));return x*x*(3-2*x);};
// Pure time sampling makes particles identical on seeks and parallel render workers.
function draw(t){
 ctx.clearRect(0,0,W,H);const cx=W/2,cy=H*.51;
 const rise=smooth(0,1.5,t),gather=smooth(3,5,t),launch=smooth(8.6,10.5,t),settle=smooth(11.2,13,t);
 const intensity=(.38+.45*gather)*(1-.74*settle);
 for(let i=0;i<160;i++){
  const a=seed(i+4)*Math.PI*2,r=110+seed(i+22)*Math.min(W,H)*.70;
  const orbit=a+t*(.035+seed(i+30)*.025);
  const stream=launch*(1-settle),depth=.3+seed(i+800)*.7;
  const x=cx+Math.cos(orbit)*r*(1+.35*stream)+Math.sin(t*.3+i)*18;
  const y=cy+Math.sin(orbit)*r*(wide?.54:1.35)-stream*H*.18*depth;
  const alpha=(.15+seed(i+55)*.6)*intensity*rise;
  ctx.fillStyle=`rgba(255,204,0,${alpha})`;ctx.beginPath();ctx.arc(x,y,(.7+seed(i+120)*1.5)*depth,0,Math.PI*2);ctx.fill();
 }
 // An authored elliptical light path carries the eye through the arrangement.
 const arcIn=smooth(3.6,4.8,t)*(1-smooth(11.2,12.5,t));
 if(arcIn>0){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.23+launch*.5);ctx.scale(1,wide?.48:1.3);
  for(let j=0;j<3;j++){ctx.beginPath();ctx.strokeStyle=`rgba(255,204,0,${arcIn*(.20-j*.055)})`;ctx.lineWidth=j===0?2:1;ctx.ellipse(0,0,Math.min(W,H)*(.40+j*.05)*(1+launch*.7),Math.min(W,H)*(.40+j*.05)*(1+launch*.7),0,-2.6+t*.3,-.2+t*.3);ctx.stroke();}
  ctx.restore();
 }
 const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,Math.min(W,H)*.63);
 glow.addColorStop(0,`rgba(255,204,0,${.05*rise+.075*launch*(1-settle)})`);glow.addColorStop(1,'rgba(255,204,0,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:15,duration:15,ease:'none',onUpdate:()=>draw(clock.t)},0);
tl.set('.scene',{opacity:0},0).set('#s1',{opacity:1},0);
tl.set('.anchor',{xPercent:-50,yPercent:-50},0);
tl.fromTo('.plate',{rotationX:52,rotationY:-18,rotationZ:-12,scale:1.26,opacity:.12},{rotationX:8,rotationY:-4,rotationZ:-3,scale:1,opacity:1,duration:1.8,ease:'power3.out'},0);
tl.fromTo('.inputline',{opacity:0,y:35},{opacity:1,y:0,duration:.75,ease:'power3.out'},.25);
tl.fromTo('.prompt-title',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.65,ease:'power2.out'},.32);
tl.fromTo('.ground',{scaleX:0,opacity:0},{scaleX:1,opacity:.5,duration:1.1,ease:'power2.out'},.35);
tl.fromTo('.sheen',{x:0},{x:wide?2900:2200,duration:2,ease:'power2.inOut'},.15);
tl.to('.cursor',{opacity:0,duration:.18,repeat:3,yoyo:true},2.1);
tl.to('.plate',{rotationX:30,rotationY:0,rotationZ:0,scale:.56,y:-70,opacity:0,duration:.9,ease:'power3.inOut'},3.2);
tl.to('.ground',{opacity:0,duration:.4},3.5).set('#s1',{opacity:0},4.1);
tl.set('#s2',{opacity:1},3.15);
tl.fromTo('.build-title',{y:40,opacity:0},{y:0,opacity:1,duration:.65,ease:'power3.out'},3.8);
document.querySelectorAll('.panel').forEach((p,i)=>{
 const x=wide?(i-1)*460:0,y=wide?0:(i-1)*270;
 tl.set(p,{xPercent:-50,yPercent:-50},0);
 tl.fromTo(p,{x:0,y:0,z:-500,rotationX:wide?35:45,rotationY:(i-1)*15,rotationZ:(i-1)*-8,scale:.42,opacity:0},{x,y,z:0,rotationX:0,rotationY:0,rotationZ:0,scale:1,opacity:1,duration:1.2,ease:'power3.out'},3.15+i*.10);
 tl.fromTo(p.querySelectorAll('.stroke'),{scaleX:0,transformOrigin:'left'},{scaleX:1,duration:.7,stagger:.1,ease:'power3.out'},4.65+i*.15);
 tl.to(p,{x:x*(wide?2.7:1)+(wide?0:(i-1)*650),y:y*2-150,z:300,rotationX:-20,rotationY:(i-1)*-25,scale:1.2,opacity:0,duration:.95,ease:'power3.in'},8.3+i*.10);
});
tl.to('.build-title',{opacity:0,y:-40,duration:.45},8.4).set('#s2',{opacity:0},9.55);
tl.set('#s3',{opacity:1},9.05);
tl.fromTo('.launch-word',{scale:.65,opacity:0,y:55},{scale:1,opacity:1,y:0,duration:.75,ease:'power3.out'},9.05);
tl.fromTo('.wordline',{scaleX:0},{scaleX:1,duration:.85,ease:'power3.inOut'},9.25);
tl.to('.launch-word',{scale:1.15,opacity:0,y:-40,duration:.55,ease:'power2.in'},11.0);
tl.to('.wordline',{scaleX:0,opacity:0,duration:.5},11.15).set('#s3',{opacity:0},11.65);
tl.set('#s4',{opacity:1},11.5);
tl.fromTo('.closing',{opacity:0,scale:.89,y:35},{opacity:1,scale:1,y:0,duration:.85,ease:'power3.out'},11.5);
tl.fromTo('.separator',{scaleX:0},{scaleX:1,duration:.55,ease:'power3.out'},12);
tl.fromTo('.url',{opacity:0,y:20},{opacity:1,y:0,duration:.5,ease:'power3.out'},12.1);
tl.set('#film',{opacity:1},15);window.__timelines.main=tl;draw(0);
