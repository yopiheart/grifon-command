<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grifon shader launch — editable composition</title>
  <style>
    @font-face{font-family:Inter;src:url('./assets/inter-variable.ttf') format('truetype');font-weight:100 900;font-display:block}
    @font-face{font-family:InterBlack;src:url('./assets/inter-900.ttf') format('truetype');font-weight:900;font-display:block}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090B}body{font-family:Inter,Arial,sans-serif;color:#fff}
    #root{position:relative;isolation:isolate;width:1920px;height:1080px;overflow:hidden;background:#09090B;transform-origin:top left}
    .scene{position:absolute;inset:0;visibility:hidden;pointer-events:none}.shader-layer{position:absolute;display:block;pointer-events:none}#shader-background{inset:0;width:100%;height:100%;opacity:.18;z-index:0}

    #intent-scene{z-index:3}#cream-field{position:absolute;inset:0;background:#F2F1EA;opacity:0}
    #orb-world{position:absolute;left:845px;top:30px;width:960px;height:960px;transform-origin:center}
    #orb-aura{position:absolute;inset:65px;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.17),transparent 63%);filter:blur(55px);transform:scale(1.35)}
    #shader-orb{inset:0;width:960px;height:960px;z-index:2;border-radius:50%}#orb-shadow{position:absolute;left:145px;right:90px;bottom:12px;height:90px;border-radius:50%;background:rgba(9,9,11,.18);filter:blur(37px)}
    #orb-ring{position:absolute;left:-150px;top:296px;width:1260px;height:340px;border:1.5px solid rgba(255,204,0,.48);border-radius:50%;transform:rotate(-26deg);z-index:3;box-shadow:0 0 0 16px rgba(255,204,0,.014)}
    #orb-ring:after{content:'';position:absolute;inset:16px;border-radius:50%;border:1px solid rgba(255,255,255,.17)}
    #orb-glint{position:absolute;left:250px;top:164px;width:300px;height:2px;background:linear-gradient(90deg,transparent,#FFF,transparent);filter:blur(4px);transform:rotate(-32deg);z-index:4}
    #intent-copy{position:absolute;left:165px;top:347px;width:1290px;margin:0;font-family:InterBlack,Inter,sans-serif;font-size:135px;font-weight:900;line-height:1.08;letter-spacing:-7px;z-index:5}
    #intent-copy .line{display:block;white-space:nowrap}#intent-copy .line:first-child{font-family:Inter,sans-serif;font-size:102px;font-weight:600;letter-spacing:-5px;margin-bottom:10px}#intent-copy .line:last-child{color:#FFCC00}
    #intent-rule{position:absolute;left:175px;top:692px;width:118px;height:3px;background:#FFCC00;z-index:5}
    #workflow-scene{z-index:3}#workflow-copy{position:absolute;left:155px;top:275px;width:720px;z-index:5}#workflow-title{font-size:112px;font-family:InterBlack,Inter,sans-serif;line-height:1;letter-spacing:-6px;margin:0}#workflow-detail{font-size:49px;font-weight:400;line-height:1.25;letter-spacing:-1.8px;margin:40px 0 0;max-width:620px;color:#D4D4D8}
    #workflow-panel{position:absolute;left:935px;top:205px;width:820px;height:530px;border:1px solid rgba(255,255,255,.15);border-radius:38px;overflow:hidden;transform-origin:center;background:#18181B;z-index:3;box-shadow:inset 0 1px 0 rgba(255,255,255,.23),0 35px 100px rgba(9,9,11,.5)}

    #workflow-geometry{position:absolute;inset:0;width:100%;height:100%;z-index:2}.geometry-group{opacity:0}.geometry-stroke{stroke:#FFCC00;stroke-width:2;fill:none}.geometry-soft{stroke:rgba(255,255,255,.28);stroke-width:1.5;fill:none}.geometry-fill{fill:rgba(255,204,0,.09);stroke:rgba(255,204,0,.7);stroke-width:1.4}
    #panel-sheen{position:absolute;top:-300px;left:-600px;width:300px;height:1100px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);transform:rotate(26deg);z-index:4}
    #workflow-track{position:absolute;left:180px;top:850px;width:1560px;height:142px;z-index:4;display:flex;justify-content:space-between}
    #workflow-track:before{content:'';position:absolute;left:19px;right:19px;top:13px;height:1px;background:rgba(255,255,255,.17)}
    .track-step{position:relative;width:280px;display:flex;flex-direction:column;align-items:center;font-size:29px;font-weight:600;letter-spacing:-.6px;gap:24px}.track-step:first-child{align-items:flex-start}.track-step:nth-child(3){align-items:flex-end}.track-dot{position:relative;width:27px;height:27px;border:1px solid rgba(255,255,255,.34);border-radius:50%;background:#09090B}.track-step.active .track-dot{border-color:#FFCC00;box-shadow:0 0 38px rgba(255,204,0,.15)}.track-step.active .track-label{color:#FFCC00}
    #workflow-signal{position:absolute;left:0;top:3px;width:20px;height:20px;border-radius:50%;background:#FFCC00;z-index:4;box-shadow:0 0 34px rgba(255,204,0,.35)}
    #screen-scene{z-index:4}#screen-copy{position:absolute;left:155px;top:165px;width:1620px;margin:0;font-size:66px;font-family:InterBlack,Inter,sans-serif;font-weight:900;letter-spacing:-3px;z-index:5}
    #screen-disclosure{position:absolute;right:152px;top:150px;font-size:64px;font-weight:600;letter-spacing:-2px;color:#FFCC00;z-index:5;border:1px solid rgba(255,204,0,.35);border-radius:100px;padding:11px 28px;background:#09090B}
    #screen-panel{position:absolute;left:155px;top:278px;width:1610px;height:688px;overflow:visible;border:0;border-radius:29px;background:transparent;transform-origin:center;z-index:4;box-shadow:0 36px 90px rgba(9,9,11,.76),0 0 100px rgba(255,204,0,.028)}
    .product-capture{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0%;opacity:0;background:#09090B}
    #screen-rim{display:none}
    #direction-scene{z-index:4}#direction-copy{position:absolute;left:160px;top:270px;width:1600px;margin:0;font-family:InterBlack,Inter,sans-serif;font-size:139px;font-weight:900;line-height:1.09;letter-spacing:-7px;z-index:5}#direction-copy .line{display:block;white-space:nowrap}#direction-copy .line:last-child{color:#FFCC00}
    #direction-field{position:absolute;left:460px;top:715px;width:1530px;height:200px;border:1px solid rgba(255,204,0,.36);border-radius:50%;transform:rotate(-18deg);z-index:2;box-shadow:0 0 0 30px rgba(255,204,0,.017),0 0 0 70px rgba(255,204,0,.012)}
    #finish-scene{z-index:5}#finish-aura{position:absolute;left:360px;top:170px;width:1200px;height:760px;background:radial-gradient(ellipse,rgba(255,204,0,.07),transparent 66%);filter:blur(45px)}
    #finish-light{position:absolute;left:100px;top:575px;width:1720px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,204,0,.35),rgba(255,255,255,.22),transparent);transform-origin:center;z-index:2}
    #brand{position:absolute;left:0;top:424px;width:100%;display:flex;align-items:center;flex-direction:column;z-index:4;transform-origin:50% 50%}#brand-lockup{display:flex;align-items:center;justify-content:center;gap:34px;height:165px}#mark-ring{height:144px;width:144px;border:1.5px solid #FFCC00;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:transparent}#brand-mark{width:74%;height:74%;object-fit:contain;display:block}#brand-word{font-family:InterBlack,Inter,sans-serif;font-weight:900;font-style:italic;line-height:1;font-size:146px;letter-spacing:-8px;padding-right:18px;color:#fff}#brand-url{margin:44px 0 0;font-size:52px;font-weight:400;line-height:1.3;letter-spacing:.3px;color:#D4D4D8}
    #edge-grade{position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(0deg,rgba(9,9,11,.14),transparent 25%,transparent 78%,rgba(9,9,11,.12))}
    #root.portrait{width:1080px;height:1920px}.portrait #opening-copy,.portrait #fragment-field{left:90px;top:670px;width:900px;font-size:173px;line-height:1.05;letter-spacing:-9px}.portrait #opening-rule{left:99px;top:1090px;width:138px}.portrait #opening-signal{left:875px;top:1100px}
    .portrait #orb-world{left:60px;top:88px}.portrait #intent-copy{left:90px;top:1143px;width:900px;font-size:128px;letter-spacing:-6.8px}.portrait #intent-copy .line:first-child{font-size:100px;letter-spacing:-5px;margin-bottom:17px}.portrait #intent-rule{left:99px;top:1480px}.portrait #orb-ring{left:-70px;top:350px;width:1100px;height:275px}
    .portrait #workflow-copy{left:90px;top:245px;width:900px}.portrait #workflow-title{font-size:129px;letter-spacing:-7px}.portrait #workflow-detail{font-size:57px;letter-spacing:-2.1px;max-width:890px;margin-top:40px}.portrait #workflow-panel{left:90px;top:695px;width:900px;height:705px;border-radius:42px}.portrait #workflow-track{left:105px;top:1535px;width:870px;height:160px}.portrait .track-step{width:245px;font-size:30px;gap:33px}
    .portrait #screen-copy{left:90px;top:178px;width:900px;font-size:90px;letter-spacing:-4px}.portrait #screen-disclosure{left:90px;right:auto;top:319px;font-size:33px;letter-spacing:0;padding:13px 25px}.portrait #screen-panel{left:90px;top:450px;width:900px;height:1330px;border-radius:34px}
    .portrait #direction-copy{left:90px;top:615px;width:900px;font-size:135px;letter-spacing:-7px;line-height:1.08}.portrait #direction-field{left:-210px;top:1470px;width:1420px;height:285px;transform:rotate(-25deg)}
    .portrait #brand{top:790px}.portrait #brand-lockup{gap:26px;height:155px}.portrait #mark-ring{width:123px;height:123px}.portrait #brand-word{font-size:135px;letter-spacing:-7px;padding-right:14px}.portrait #brand-url{font-size:42px;margin-top:53px}.portrait #finish-aura{left:-60px;top:530px;width:1200px;height:760px}.portrait #finish-light{left:60px;top:890px;width:960px}
  </style>
</head>
<body>
  <main id="root" aria-label="Editable original Grifon launch composition">

ria-hidden="true"></div></div><div id="workflow-track"><div class="track-step"><span class="track-dot"></span><span class="track-label"></span></div><div class="track-step"><span class="track-dot"></span><span class="track-label"></span></div><div class="track-step"><span class="track-dot"></span><span class="track-label"></span></div><div id="workflow-signal" aria-hidden="true"></div></div></section>
    <section id="screen-scene" class="scene"><h2 id="screen-copy"></h2><div id="screen-disclosure"></div><div id="screen-panel"><img class="product-capture" id="capture-research" alt="Manually prepared Research example project"><img class="product-capture" id="capture-script" alt="Manually prepared Script example project"><img class="product-capture" id="capture-storyboard" alt="Manually prepared Storyboard example project"><div id="screen-rim" aria-hidden="true"></div></div></section>
    <section id="direction-scene" class="scene"><h2 id="direction-copy"></h2><div id="direction-field" aria-hidden="true"></div></section>
    <section id="finish-scene" class="scene"><div id="finish-aura" aria-hidden="true"></div><div id="finish-light" aria-hidden="true"></div><div id="brand"><div id="brand-lockup"><div id="mark-ring"><img id="brand-mark" alt="" src="./assets/logo.png"></div><div id="brand-word"></div></div><p id="brand-url"></p></div></section>

  </main>
  <script type="module" src="./composition.js"></script>
