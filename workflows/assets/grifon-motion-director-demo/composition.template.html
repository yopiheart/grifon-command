<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width={{WIDTH}}, initial-scale=1">
<title>Grifon Motion Director - {{FORMAT}}</title>
<style>
@font-face{font-family:Inter;src:url('{{INTER}}') format('truetype');font-weight:900;font-display:block}
@font-face{font-family:Mono;src:url('{{MONO}}') format('truetype');font-weight:600;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:{{WIDTH}}px;height:{{HEIGHT}}px;overflow:hidden;background:{{BG}}}
body{font-family:Inter,sans-serif;color:{{TEXT}}}#film{position:relative;width:100%;height:100%;overflow:hidden;background:{{BG}}}
.ambient{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 47%,rgba(255,204,0,.07),transparent 55%),radial-gradient(ellipse at 70% 20%,#181819,transparent 65%)}
.grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#77777922 1px,transparent 1px),linear-gradient(90deg,#77777922 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(ellipse,#000,transparent 72%)}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0}
.badge{width:320px;height:320px;border-radius:50%;border:2px solid {{GOLD}};display:flex;align-items:center;justify-content:center;flex:none}
.badge img{height:74%;width:auto;object-fit:contain}
.brand{font-size:100px;font-style:italic;letter-spacing:-5px;margin:40px 0 0;line-height:1.05}
.gold{color:{{GOLD}}}.line{position:absolute;width:760px;height:3px;background:linear-gradient(90deg,transparent,{{GOLD}},transparent);left:160px;top:1130px;transform-origin:center}
.orbit{position:absolute;width:650px;height:650px;border:1px solid rgba(255,204,0,.2);border-radius:50%;left:215px;top:550px}
.orbit:after{content:'';position:absolute;width:16px;height:16px;background:{{GOLD}};border-radius:50%;top:83px;left:84px;box-shadow:0 0 24px #ffcc0066}
.mark-group{display:flex;align-items:center;flex-direction:column}
.prompt{position:relative;width:870px;height:250px;border-radius:38px;border:2px solid #ffffff26;background:linear-gradient(135deg,#29292d,#141416);padding:50px;box-shadow:0 0 95px #ffcc0009;display:flex;align-items:center;justify-content:center;gap:20px}
.prompt:before{content:'';position:absolute;top:-2px;left:50px;right:50px;height:2px;background:linear-gradient(90deg,transparent,#ffcc00bb,transparent)}
.prompt-title{font-size:99px;letter-spacing:-5px;line-height:1}
.cursor{width:7px;height:90px;background:{{GOLD}};flex:none}
.prompt-glyph{width:50px;height:50px;position:absolute;left:55px;top:-105px;color:{{GOLD}}}
.trace{position:absolute;width:2px;height:130px;background:linear-gradient(transparent,{{GOLD}});left:539px;top:580px;transform-origin:bottom}
.build-title{font-size:130px;letter-spacing:-7px;position:absolute;top:450px;left:0;right:0;text-align:center;line-height:1;margin:0}
.cards{position:absolute;top:700px;left:185px;width:710px;height:690px}
.panel{position:absolute;left:0;width:710px;height:200px;border:1px solid #ffffff29;border-radius:30px;background:linear-gradient(130deg,#272729,#121214);display:flex;align-items:center;padding:35px 48px;gap:45px;box-shadow:0 14px 50px #00000033;transform-origin:center}
.panel:nth-child(1){top:0}.panel:nth-child(2){top:225px}.panel:nth-child(3){top:450px}
.panel-icon{width:100px;height:100px;flex:none;color:{{GOLD}}}
.strokes{display:flex;flex-direction:column;gap:20px;width:100%}.stroke{height:11px;border-radius:8px;background:#f5f5f73d}.stroke:first-child{width:90%;background:#f5f5f7aa}.stroke:nth-child(2){width:70%}.stroke:nth-child(3){width:48%;background:#ffcc0055}
.launch-word{font-size:145px;letter-spacing:-9px;line-height:1;position:absolute;top:680px;left:0;right:0;text-align:center}
.closing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px}
.closing .badge{width:270px;height:270px}.url{font-size:93px;letter-spacing:-4px;line-height:1;margin:0}
.closing-line{width:140px;height:4px;background:{{GOLD}}}
.rail{position:absolute;bottom:280px;left:380px;display:flex;gap:20px}.rail span{height:4px;width:90px;background:#ffffff25;border-radius:5px}.rail .active{background:{{GOLD}};transform-origin:left}
.landscape .badge{width:240px;height:240px}.landscape .brand{font-size:105px;margin-top:30px}
.landscape .orbit{width:590px;height:590px;left:665px;top:240px}.landscape .line{width:1000px;left:460px;top:790px}
.landscape .prompt{width:1120px;height:250px}.landscape .prompt-title{font-size:126px}.landscape .prompt-glyph{left:30px;top:-95px}
.landscape .trace{left:959px;top:160px;height:100px}
.landscape .build-title{font-size:116px;top:210px}.landscape .cards{top:400px;left:260px;width:1400px;height:360px;display:flex;gap:34px}
.landscape .panel{position:relative;top:0;left:0;width:444px;height:340px;padding:40px;flex-direction:column;align-items:flex-start;gap:30px}.landscape .panel-icon{width:80px;height:80px}
.landscape .launch-word{font-size:180px;top:400px}.landscape .closing{flex-direction:row;gap:65px}.landscape .closing .badge{width:270px;height:270px}.landscape .closing-line{width:4px;height:120px}.landscape .url{font-size:126px}
.landscape .rail{bottom:120px;left:800px}
</style>
</head>
<body>
<main id="film" class="{{FORMAT}}" data-composition-id="main" data-start="0" data-width="{{WIDTH}}" data-height="{{HEIGHT}}" data-duration="12" data-fps="24">
  <div class="ambient"></div><div class="grid"></div>
  <div id="s1" class="scene">
    <div class="orbit"></div><div class="line"></div>
    <div class="mark-group"><span class="badge"><img class="clip" src="{{LOGO}}" id="opening-logo" alt="" data-start="0" data-duration="3" data-track-index="1"></span><p class="brand">{{BRAND}}</p></div>
  </div>
  <div id="s2" class="scene">
    <div class="trace"></div>
    <div class="prompt">
      <svg class="prompt-glyph" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 10l12 14L6 38M24 38h18"/></svg>
      <span class="prompt-title" data-copy="describe">{{DESCRIBE}}</span><span class="cursor"></span>
    </div>
  </div>
  <div id="s3" class="scene">
    <h1 class="build-title gold" data-copy="build">{{BUILD}}</h1>
    <div class="cards">
      <div class="panel"><svg class="panel-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="15" y="15" width="70" height="70" rx="14"/><path d="M28 36h44M28 50h32M28 64h22"/></svg><div class="strokes"><i class="stroke"></i><i class="stroke"></i><i class="stroke"></i></div></div>
      <div class="panel"><svg class="panel-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="15" y="15" width="70" height="70" rx="14"/><path d="M25 70l22-25 15 15 12-12M62 33h1"/></svg><div class="strokes"><i class="stroke"></i><i class="stroke"></i><i class="stroke"></i></div></div>
      <div class="panel"><svg class="panel-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="15" y="15" width="70" height="70" rx="14"/><path d="M40 32l27 18-27 18z"/></svg><div class="strokes"><i class="stroke"></i><i class="stroke"></i><i class="stroke"></i></div></div>
    </div>
  </div>
  <div id="s4" class="scene">
    <div class="launch-word gold" data-copy="launch">{{LAUNCH}}</div>
    <div class="closing"><span class="badge"><img class="clip" src="{{LOGO}}" id="closing-logo" alt="" data-start="10.05" data-duration="1.95" data-track-index="2"></span><div class="closing-line"></div><p class="url">{{URL}}</p></div>
  </div>
  <div class="rail" aria-hidden="true"><span><span class="active" id="p1"></span></span><span><span class="active" id="p2"></span></span><span><span class="active" id="p3"></span></span></div>
</main>
<script src="vendor/gsap.min.js"></script>
<script>
window.__timelines = {};
const tl = gsap.timeline({paused:true});
const wide = document.querySelector('#film').classList.contains('landscape');
tl.set('.scene',{opacity:0},0).set('#s1',{opacity:1},0);
tl.set('.rail .active',{display:'block',scaleX:0},0);
tl.fromTo('#s1 .badge',{scale:.86,opacity:.12},{scale:1,opacity:1,duration:.65,ease:'power3.out'},0);
tl.fromTo('.brand',{y:35,opacity:0},{y:0,opacity:1,duration:.6,ease:'power3.out'},.25);
tl.fromTo('.orbit',{scale:.75,opacity:0,rotation:-55},{scale:1,opacity:1,rotation:15,duration:2.7,ease:'power2.out'},0);
tl.fromTo('.line',{scaleX:0},{scaleX:1,duration:1.25,ease:'power3.inOut'},.6);
tl.to('#s1 .mark-group',{y:-65,scale:.94,opacity:.3,duration:.35,ease:'power2.in'},2.6);
tl.set('#s1',{opacity:0},3);
tl.set('#s2',{opacity:1},3);
tl.fromTo('.prompt',{y:75,scale:.92,opacity:.3},{y:0,scale:1,opacity:1,duration:.5,ease:'power3.out'},3);
tl.fromTo('.prompt-title',{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0% 0 0)',duration:.8,ease:'steps(8)'},3.45);
tl.fromTo('.prompt-glyph',{opacity:0,y:15},{opacity:1,y:0,duration:.4},3.2);
tl.fromTo('.trace',{scaleY:0,opacity:0},{scaleY:1,opacity:1,duration:.5},3.1);
tl.to('#p1',{scaleX:1,duration:.4},3.3);
tl.to('.cursor',{opacity:0,duration:.1,repeat:3,yoyo:true},4.7);
tl.to('.prompt',{scale:.88,y:wide?50:170,opacity:.3,duration:.35,ease:'power3.in'},5.65);
tl.set('#s2',{opacity:0},6);
tl.set('#s3',{opacity:1},6);
tl.fromTo('.build-title',{y:50,opacity:.3},{y:0,opacity:1,duration:.4,ease:'power3.out'},6);
tl.fromTo('.panel',{y:100,scale:.8,opacity:0,rotation:wide?-4:3},{y:0,scale:1,opacity:1,rotation:0,duration:.55,stagger:.14,ease:'power3.out'},6.1);
tl.fromTo('.stroke',{scaleX:0,transformOrigin:'left'},{scaleX:1,duration:.55,stagger:.035,ease:'power3.out'},6.65);
tl.to('#p2',{scaleX:1,duration:.4},6.4);
tl.to('.panel',{scale:.78,y:-60,opacity:0,duration:.35,stagger:.06,ease:'power2.in'},8.5);
tl.set('#s3',{opacity:0},9);
tl.set('#s4',{opacity:1},9);
tl.fromTo('.launch-word',{scale:.72,y:70,opacity:.3},{scale:1,y:0,opacity:1,duration:.4,ease:'power3.out'},9);
tl.to('#p3',{scaleX:1,duration:.4},9.15);
tl.to('.launch-word',{scale:1.13,opacity:0,y:-40,duration:.3,ease:'power2.in'},9.8).set('.launch-word',{opacity:0},10.1);
tl.fromTo('.closing',{y:45,opacity:0,scale:.94},{y:0,opacity:1,scale:1,duration:.45,ease:'power3.out'},10.05);
tl.fromTo('.closing-line',{scale:0},{scale:1,duration:.4,ease:'power3.out'},10.35);
tl.to('.ambient',{opacity:.7,duration:12,ease:'none'},0);
tl.set('#film',{opacity:1},12);
window.__timelines["main"] = tl;
</script>
</body></html>
