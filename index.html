<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grifon AI — Create your entire ad campaign in 30 minutes</title>
    <meta name="description" content="AI-powered marketing studio built in the Philippines. Scripts, videos, images, captions, market research — your entire ad campaign in one app." />

    <!-- Open Graph / Facebook / Messenger / Viber -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.grifon.ai/" />
    <meta property="og:site_name" content="Grifon" />
    <meta property="og:title" content="Grifon AI — Create your entire ad campaign in 30 minutes" />
    <meta property="og:description" content="AI-powered marketing studio built in the Philippines. Scripts, videos, images, captions, market research — your entire ad campaign in one app." />
    <meta property="og:image" content="https://app.grifon.ai/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Grifon — your entire ad agency, built into one app. ₱997/mo." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Grifon AI — Create your entire ad campaign in 30 minutes" />
    <meta name="twitter:description" content="AI-powered marketing studio built in the Philippines. Scripts, videos, images, captions, market research — your entire ad campaign in one app." />
    <meta name="twitter:image" content="https://app.grifon.ai/og-card.png" />
    <meta name="twitter:image:alt" content="Grifon — your entire ad agency, built into one app. ₱997/mo." />

    <!-- Theme color (mobile browser chrome) -->
    <meta name="theme-color" content="#09090B" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Sourced from DESIGN.md — see colors section. */
        --brand-primary: #FFCC00; /* was purple #D67BFF; purged per design directive */
        --brand-yellow: #FFCC00;
        --bg-dark: #09090B; /* was near-black #050505; now surface (zinc-950) */
      }

      body {
        background-color: var(--bg-dark);
        color: white;
        overflow-x: hidden;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.05) 0%, transparent 100%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 50px 50px, 50px 50px;
        
        /* LAW: GLOBAL BODY TEXT */
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        line-height: 1.625;
      }

      /* LAW: ALL HEADINGS (Inter Black, Uppercase, Tighter) */
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Inter', sans-serif !important;
        font-weight: 900 !important;
        text-transform: uppercase !important;
        letter-spacing: -0.05em !important;
      }

      /* LAW: LABELS, BUTTONS, TECHNICAL DATA (JetBrains Mono, Widest) */
      label, button, .font-mono, input, textarea, select, .tech-data {
        font-family: 'JetBrains Mono', monospace !important;
        letter-spacing: 0.1em !important;
      }

      label {
        text-transform: uppercase !important;
      }

      /* Radial Cursor Glow (Flashlight Effect) */
      .flashlight {
        position: fixed;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle at center, rgba(255, 204, 0, 0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
      }

      @keyframes rotate_border {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .animated-brand-container {
        position: relative;
        border-radius: 9999px;
        padding: 1px;
        overflow: hidden;
      }
      
      .animated-brand-container::before {
        content: '';
        position: absolute;
        z-index: -1;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          var(--brand-primary),
          var(--brand-yellow),
          var(--brand-primary) 
        );
        animation: rotate_border 4s linear infinite;
      }

      .brand-text-inner {
        background-color: var(--bg-dark);
        padding: 0.4rem 1.2rem;
        border-radius: 9999px;
        display: block;
      }

      /* Custom Scrollbar for the Premium Feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b; /* bg-zinc-950 */
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; /* bg-zinc-800 */
        border-radius: 9999px; /* rounded-full */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46; /* hover:bg-zinc-700 */
      }

      .scanner-active {
        position: relative;
        overflow: hidden;
      }
      .scanner-active::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(to right, transparent, var(--brand-primary), transparent);
        box-shadow: 0 0 15px var(--brand-primary);
        animation: scan-move 2s linear infinite;
      }
      @keyframes scan-move {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
      }

      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }

      @keyframes scroll { 
        0% { transform: translateX(0); } 
        100% { transform: translateX(-50%); } 
      }
      .animate-scroll { 
        animation: scroll 20s linear infinite; 
      }

      .executive-header {
        letter-spacing: 0.5em;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      }
    </style>
    <script>
      // ============================================================
      // Inline Tailwind config — sourced from DESIGN.md (role names)
      // To regenerate the canonical tokens: npm run design:tailwind
      // (output: design.tokens.json) then mirror the `colors` block below.
      // ============================================================
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
              oswald: ['Oswald', 'sans-serif'],
            },
            colors: {
              // --- DESIGN.md roles (canonical) ---
              'primary':             '#FFCC00',
              'surface':             '#09090B',
              'surface-elevated':    '#18181B',
              'on-surface':          '#FFFFFF',
              'on-surface-muted':    '#D4D4D8',
              'on-surface-dim':      '#A1A1AA',
              'on-surface-sublabel': '#71717A',

              // --- Transitional aliases (legacy names → DESIGN.md values) ---
              // The old `brand-primary` was purple (#D67BFF) — purged per design directive.
              // Delete each alias as its consumers migrate to role names.
              'brand-primary':       '#FFCC00', // was purple; now gold
              'brand-yellow':        '#FFCC00', // alias of primary
              'brand-yellow-dark':   '#B28F00',
              'brand-green':         '#10B981', // success signal; not in DESIGN.md
              'brand-light':         '#D4D4D8', // → on-surface-muted
              'brand-dark':          '#09090B', // → surface (was #050505)
              'brand-secondary':     '#71717A', // → on-surface-sublabel
              'background-dark':     '#09090B', // → surface (was #050505)
              'background-light':    '#18181B', // → surface-elevated (was #111111)
              'input-bg':            'rgba(255, 255, 255, 0.05)',
              'text-primary':        '#FFFFFF', // → on-surface
              'text-secondary':      '#A1A1AA', // → on-surface-dim
              'border-color':        'rgba(255, 255, 255, 0.08)',
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "file-saver": "https://aistudiocdn.com/file-saver@^2.0.5",
        "jszip": "https://aistudiocdn.com/jszip@^3.10.1"
      }
    }
    </script>
  </head>
  <body class="bg-background-dark text-text-primary">
    <div id="flashlight" class="flashlight"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      const flashlight = document.getElementById('flashlight');
      document.addEventListener('mousemove', (e) => {
        flashlight.style.left = e.clientX + 'px';
        flashlight.style.top = e.clientY + 'px';
      });
    </script>
  </body>
</html>
