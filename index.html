    <!-- Structured data (JSON-LD) — Organization + WebApplication + FAQ.
         Companion to /llms.txt and /sitemap.xml. Update offers when pricing
         changes; FAQ entries should stay in sync with the landing TrustFaq. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://grifon.ai/#organization",
          "name": "Grifon Command",
          "alternateName": ["Grifon AI", "Grifon"],
          "url": "https://grifon.ai/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://grifon.ai/logo.png",
            "width": 512,
            "height": 512
          },
          "email": "grifon.ai@gmail.com",
          "areaServed": {
            "@type": "Country",
            "name": "Philippines"
          },
          "description": "AI ad planning and creation for Filipino business owners who handle their own marketing. Research, scripts, storyboards, and video creative in one guided workflow."
        },
        {
          "@type": "WebApplication",
          "@id": "https://grifon.ai/#software",
          "name": "Grifon Command",
          "alternateName": "Grifon AI",
          "url": "https://grifon.ai/",
          "image": "https://grifon.ai/og-card.png",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "MarketingApplication",
          "operatingSystem": "Any (web browser)",
          "browserRequirements": "Requires JavaScript and a modern browser (Chrome, Safari, Edge, Firefox).",
          "inLanguage": ["en", "fil", "tl"],
          "publisher": { "@id": "https://grifon.ai/#organization" },
          "description": "AI ad creation for business owners and small teams. Start with a free ad plan, then choose a paid plan for finished video creation. Includes research, offer planning, scripts, storyboards, image concepts, and captions.",
          "offers": {
            "@type": "AggregateOffer",
            "priceCurrency": "PHP",
            "lowPrice": "0",
            "highPrice": "4997",
            "offerCount": 4,
            "offers": [
              {
                "@type": "Offer",
                "name": "Free",
                "price": "0",
                "priceCurrency": "PHP",
                "description": "One complete ad plan per month to preview. No card needed. Finished video creation is not included.",
                "url": "https://grifon.ai/pricing"
              },
              {
                "@type": "Offer",
                "name": "Starter",
                "price": "997",
                "priceCurrency": "PHP",
                "description": "30 days of access. Includes one finished video ad, a full ad plan, and watermark-free video download.",
                "url": "https://grifon.ai/pricing"
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "2497",
                "priceCurrency": "PHP",
                "description": "30 days of access. Includes eight finished video ads, AI editing tools, Director mode, caption packs, community and a monthly group call.",
                "url": "https://grifon.ai/pricing"
              },
              {
                "@type": "Offer",
                "name": "Business",
                "price": "4997",
                "priceCurrency": "PHP",
                "description": "30 days of access. Includes fifteen finished video ads, with additional creative tools and support. See the pricing page for full limits.",
                "url": "https://grifon.ai/pricing"
              }
            ]
          },
          "featureList": [
            "Market Research — audience and competitor reports",
            "Offer Optimizer — develop a clearer offer",
            "One-Shot Ad — guided ad planning and creation",
            "Director mode — scene-by-scene control on Pro",
            "Caption and Headline — copy ideas for Facebook ads and posts",
            "Image Studio — product and lifestyle ad concepts"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://grifon.ai/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What can I try for free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The Free plan includes one complete ad plan per month: research, a script, and a storyboard to review. No card is needed to start. Finished video creation is not included in Free; choose a paid plan when you are ready."
              }
            },
            {
              "@type": "Question",
              "name": "How many video ads can I create?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Starter includes one finished video ad per month, Pro includes eight, and Business includes fifteen. Each plan also has its own workflow and tool limits. The pricing page lists the full breakdown."
              }
            },
            {
              "@type": "Question",
              "name": "What if it is not right for my business?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Paid plans include a 7-day money-back guarantee. Review the refund policy for the terms, or contact our team if you need help choosing a plan."
              }
            },
            {
              "@type": "Question",
              "name": "Is Grifon for my business?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Grifon is built for business owners who already sell a product, service, or property and need help making ads. It is a good starting point when you handle your own marketing or work with a small team."
              }
            }
          ]
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Sourced from DESIGN.md — see colors section. */
        --brand-primary: #FFCC00; /* was purple #D67BFF; purged per design directive */
        --brand-yellow: #FFCC00;
        --bg-dark: #09090B; /* was near-black #050505; now surface (zinc-950) */
      }

      body {
        background-color: var(--bg-dark);
        color: white;
        overflow-x: hidden;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.05) 0%, transparent 100%),
          linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 100% 100%, 50px 50px, 50px 50px;
        
        /* Ordinary app text; explicit display and metadata sizes stay local. */
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.625;
      }

      /* Calm app headings; technical metadata and marketing keep their own type. */
      :is(h1, h2, h3, h4, h5, h6):not(.font-mono, .tech-data):not(.landing-page *, .public-purchase *, [data-ad-artwork] *) {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        font-weight: 600 !important;
        text-transform: none !important;
        letter-spacing: -0.02em !important;
      }

      /* Preserve the accepted exported artwork's rendered heading treatment. */
      [data-ad-artwork] :is(h1, h2, h3, h4, h5, h6) {
        font-family: 'Inter', sans-serif !important;
        font-weight: 900 !important;
        text-transform: uppercase !important;
        letter-spacing: -0.05em !important;
      }

      /* Human-readable controls; monospace is reserved for explicit technical data. */
      :is(label, input, textarea, select):not(.tech-data):not(.landing-page *, .public-purchase *),
      button:not(.tech-data):not(.landing-page *, .public-purchase *) {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
        font-size: 14px !important;
        text-transform: none !important;
        letter-spacing: normal !important;
      }

      :is(input, textarea, select):not(.tech-data):not(.landing-page *, .public-purchase *) {
        font-weight: 400 !important;
      }

      button:not(.tech-data):not(.landing-page *, .public-purchase *) {
        font-weight: 600 !important;
      }

      .tech-data {
        font-family: 'JetBrains Mono', monospace !important;
      }

      /* Radial Cursor Glow (Flashlight Effect) */
      .flashlight {
        position: fixed;
        width: 1000px;
        height: 1000px;
        background: radial-gradient(circle at center, rgba(255, 204, 0, 0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s ease;
      }

      @keyframes rotate_border {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .animated-brand-container {
        position: relative;
        border-radius: 9999px;
        padding: 1px;
        overflow: hidden;
      }
      
      .animated-brand-container::before {
        content: '';
        position: absolute;
        z-index: -1;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(
          var(--brand-primary),
          var(--brand-yellow),
          var(--brand-primary) 
        );
        animation: rotate_border 4s linear infinite;
      }

      .brand-text-inner {
        background-color: var(--bg-dark);
        padding: 0.4rem 1.2rem;
        border-radius: 9999px;
        display: block;
      }

      /* Custom Scrollbar for the Premium Feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b; /* bg-zinc-950 */
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; /* bg-zinc-800 */
        border-radius: 9999px; /* rounded-full */
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46; /* hover:bg-zinc-700 */
      }

      .scanner-active {
        position: relative;
        overflow: hidden;
      }
      .scanner-active::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(to right, transparent, var(--brand-primary), transparent);
        box-shadow: 0 0 15px var(--brand-primary);
        animation: scan-move 2s linear infinite;
      }
      @keyframes scan-move {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
      }

      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }

      @keyframes scroll { 
        0% { transform: translateX(0); } 
        100% { transform: translateX(-50%); } 
      }
      .animate-scroll { 
        animation: scroll 20s linear infinite; 
      }

      .executive-header {
        letter-spacing: 0.5em;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      }
    </style>
    <!-- Tailwind config moved to tailwind.config.js on 2026-07-25 when the
         cdn.tailwindcss.com Play CDN was replaced by a real PostCSS build.
         The theme lives there now — do not re-add an inline config block. -->
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "file-saver": "https://aistudiocdn.com/file-saver@^2.0.5",
        "jszip": "https://aistudiocdn.com/jszip@^3.10.1"
      }
    }
    </script>
  </head>
  <body class="bg-background-dark text-text-primary">
    <div id="flashlight" class="flashlight"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <script>
      const flashlight = document.getElementById('flashlight');
      document.addEventListener('mousemove', (e) => {
        flashlight.style.left = e.clientX + 'px';
        flashlight.style.top = e.clientY + 'px';
      });
    </script>
  </body>
</html>
