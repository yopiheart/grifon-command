<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grifon — OG Card (1200×630)</title>
<!--
  Source for /public/og-card.png. To regenerate the PNG:
    1. npm run dev
    2. Open http://localhost:5173/og-card.html (or whatever port Vite picks)
    3. Set viewport 1200x630, screenshot the body
  This file is the canonical source so future tweaks (copy, price, modules)
  don't need to be reverse-engineered from the PNG.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #09090B;
    background-image:
      radial-gradient(ellipse at top left, rgba(255,204,0,0.10) 0%, transparent 50%),
      radial-gradient(rgba(255,204,0,0.05) 1px, transparent 1px);
    background-size: 100% 100%, 28px 28px;
    font-family: 'Inter', sans-serif;
    color: #fff;
    padding: 56px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
  }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .wordmark {
    font-weight: 900; font-size: 30px; letter-spacing: -0.04em;
    font-style: italic; color: #fff;
  }
  .wordmark .ai { color: #FFCC00; }
  .tagline {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #71717A; text-transform: uppercase; letter-spacing: 0.22em; font-weight: 500;
  }
  /* Manifesto headline */
  .manifesto {
    font-weight: 900; text-transform: uppercase;
    letter-spacing: -0.035em; line-height: 0.94;
  }
  .manifesto .gradient {
    background: linear-gradient(180deg, #f4f4f5 0%, #71717a 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; color: transparent;
    font-size: 88px; display: block;
  }
  .manifesto .gold {
    color: #FFCC00; font-size: 88px; display: block;
    text-shadow: 0 0 40px rgba(255,204,0,0.3);
  }
  /* Module strip */
  .modules {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-top: 30px;
  }
  .module {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.16em; font-weight: 500;
    color: #D4D4D8;
    background: rgba(24,24,27,0.6);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 10px 18px;
    border-radius: 999px;
  }
  .module.active {
    color: #FFCC00;
    border-color: rgba(255,204,0,0.35);
    background: rgba(255,204,0,0.06);
  }
  /* Bottom */
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .anchor {
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: #D4D4D8; text-transform: uppercase; letter-spacing: 0.16em;
    display: flex; align-items: baseline; gap: 14px;
  }
  .anchor .strike {
    color: #a1a1aa; text-decoration: line-through;
    font-weight: 500;
  }
  .anchor .arrow {
    color: #71717A; font-size: 18px;
  }
  .anchor .price {
    color: #FFCC00; font-weight: 900; font-size: 24px;
    letter-spacing: 0.04em;
    text-shadow: 0 0 20px rgba(255,204,0,0.25);
  }
  .stamp {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: #71717A; text-transform: uppercase; letter-spacing: 0.22em;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="wordmark">GRIFON<span class="ai">.AI</span></div>
    <div class="tagline">// The entire agency · in your browser</div>
  </div>

  <div>
    <div class="manifesto">
      <span class="gradient">Your entire ad agency,</span>
      <span class="gold">built into one app.</span>
    </div>
    <div class="modules">
      <span class="module active">Director AI</span>
      <span class="module">Market Research</span>
      <span class="module">Offer Optimizer</span>
      <span class="module">Caption &amp; Headline</span>
      <span class="module">Image Studio</span>
    </div>
  </div>

  <div class="bottom">
    <div class="anchor">
      <span class="strike">₱30K agency</span>
      <span class="arrow">→</span>
      <span class="price">₱997/mo</span>
    </div>
    <div class="stamp">grifon.ai · PH</div>
  </div>
</body>
</html>
