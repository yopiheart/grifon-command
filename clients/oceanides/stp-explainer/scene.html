<html lang="en"><meta charset="utf-8"><title>Oceanides on-site STP explainer</title>

});

const returnDots=[];for(const p of [returnPath,wastePath])for(let j=0;j<8;j++){const m=new THREE.Mesh(new THREE.SphereGeometry(.065,6,6),mat(0xf5b301));plant.add(m);returnDots.push({m,p,seed:j/8});}

function building(x,z,w,d,h){box(campus,w,.2,d,x,0,z,shell);box(campus,w,h,d,x,h/2,z,shell);box(campus,w+.15,.2,d+.15,x,h+.05,z,rim);for(let y=.9;y<h-.1;y+=.75)for(let xx=x-w/2+.32;xx<x+w/2-.1;xx+=.58)box(campus,.34,.42,.02,xx,y,z+d/2+.02,blue);}

const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x);};
const mix=(a,b,t)=>a+(b-a)*t;

function wrap(t,x,y,width,size=34,color=C.ink,weight=400,line=size*1.35,face='Arial'){ctx.font=`${weight} ${size}px "${face}",Arial`;let row='',yy=y;for(const word of t.split(' ')){if(ctx.measureText(row+word).width>width&&row){txt(row.trim(),x,yy,size,color,weight,face);row='';yy+=line;}row+=word+' ';}if(row)txt(row.trim(),x,yy,size,color,weight,face);return yy;}
function projected(point){const p=new THREE.Vector3(...point);p.project(camera);return [(p.x*.5+.5)*1920,260+(-p.y*.5+.5)*630];}
function waves(dark){ctx.save();ctx.strokeStyle=dark?'#5AA6E6':C.blue;ctx.globalAlpha=dark?.3:.18;ctx.lineWidth=1.6;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(1515,60+i*12);ctx.bezierCurveTo(1625,20+i*12,1700,105+i*12,1808,62+i*12);ctx.stroke();}ctx.restore();}
function label(t,point,size=35){size=Math.max(35,size);const [x,y]=projected(point);ctx.font=`700 ${size}px "Segoe UI",Arial`;const w=ctx.measureText(t).width;ctx.fillStyle=C.paper;ctx.globalAlpha=.95;ctx.fillRect(x-w/2-12,y-size-8,w+24,size+16);ctx.globalAlpha=1;txt(t,x-w/2,y,size,C.ink,700,'Segoe UI');}
window.renderFrame=async t=>{
 const s=story.scenes.find(s=>t>=s.start&&t<s.end)||story.scenes.at(-1),local=t-s.start;

 particleGroups.forEach((g,i)=>g.children.forEach((m,j)=>{const seed=j*1.732; m.position.x=i===0?-1.35+Math.min((t*.12+j*.11)%1,.5):Math.sin(seed)*1.25;m.position.z=Math.cos(seed*.71)*1.23;
  m.position.y=i===2?.43+((t*.55+j*.093)%1.4):.35+((1-(t*.085+j*.097)%1)*1.42);m.visible=!focused||centers[i]===focus;
 }));
 dots.forEach(({m,p,seed,stage})=>{m.position.copy(p.getPointAt((t*.29+seed)%1));m.visible=!closing&&(focused?stage===centers.indexOf(focus)||stage===centers.indexOf(focus)+1:true);});
 returnDots.forEach(({m,p,seed})=>{m.position.copy(p.getPointAt((t*.075+seed)%1));m.visible=['clarify','care','benefits'].includes(s.id);});

 else{ctx.fillStyle=C.paper;ctx.fillRect(0,0,1920,310);txt('Oceanides',112,80,31,C.navy,600,'Segoe UI');ctx.strokeStyle='#D9DDD9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(112,108);ctx.lineTo(1808,108);ctx.stroke();wrap(s.title,112,210,1700,72,C.blue,400,85,'Segoe UI');txt(s.detail,114,280,35,C.gray);}
 waves(dark);
