<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* Kuya Marvin hook card (Lane A) — Fibo format, Oceanides world.
     Paper-surface rules: hook text = ink navy; accent TEXT sa paper = ocean;
     amber ay fill/chip lang na may navy text. Card sa baba = face-safe. */
  :root {
    --amber: #F5B301;
    --navy2: #0A1F45;
    --ink:   #0B1B33;
    --meta:  #5B6B85;
    --ocean: #1C63AD;
    --body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #333; }
  #canvas {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    font-family: var(--body);
    background: var(--navy2);
    -webkit-font-smoothing: antialiased;
  }
  .bg {
    position: absolute; inset: 0;
    width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
    filter: contrast(1.04) saturate(1.03);
  }
  /* mahinang ilalim na scrim para umupo ang card, hindi lumulutang */
  .seat {
    position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    background: linear-gradient(to top, rgba(10,31,69,.55), rgba(10,31,69,0));
  }
  .card {
    position: absolute; left: 48px; bottom: 48px;
    width: 800px;
    background: #FFFFFF;
    border: 4px solid var(--amber);
    border-radius: 22px;
    padding: 36px 40px 34px;
    box-shadow: 0 18px 44px rgba(0,0,0,.38);
  }
  .who { display: flex; align-items: center; gap: 18px; }
  .who img {
    width: 92px; height: 92px; border-radius: 50%;
    object-fit: cover; object-position: center 30%;
    border: 3px solid var(--navy2);
  }
  .who .name { font-weight: 900; font-size: 30px; color: var(--ink); line-height: 1.1; }
  .who .sub  { margin-top: 4px; font-weight: 700; font-size: 19px; color: var(--meta); }
  .hook {
    margin-top: 26px;
    font-weight: 800; font-size: 58px; line-height: 1.14;
    color: var(--ink); letter-spacing: -0.5px;
  }
  .hook em { font-style: normal; color: var(--ocean); }
  .pill {
    display: inline-block; margin-top: 30px;
    background: var(--amber); color: var(--navy2);
    font-weight: 900; font-size: 20px; letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 12px 22px; border-radius: 8px;
  }
</style>
</head>
<body>
  <div id="canvas">
    <img class="bg" src="%%BG%%" alt="" />
    <div class="seat"></div>
    <div class="card">
      <div class="who">
        <img src="../../profile-assets/profile-4-fullteeth-van.png" alt="Kuya Marvin" />
        <div>
          <div class="name">Kuya Marvin</div>
          <div class="sub">Oceanides &middot; septic tank siphoning</div>
        </div>
      </div>
      <div class="hook">%%HOOK%%</div>
      <div class="pill">Basahin ang caption</div>
    </div>
  </div>
</body>
</html>
