<!doctype html>
<html lang="tl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: transparent;
      }
      body { font-family: "Anton", sans-serif; }

      /* KM-003 hook stack, v2 (Neil review 2026-07-27).
         POSITION: the v1 stack sat at y=130-350 and a 4:5 news-feed placement
         (1080x1350 centre crop) eats the top 285px — "TAMA BA" was cut clean
         off. Now y=300-516, inside BOTH the 4:5 band (285-1635) and the
         product's own safeZone() top of 269 / HOOK_TOP_FRAC 0.15 = y288
         (drawPlan.ts). Marvin's head-top sits at y~340-380 through the
         push-in, so the stack grazes hair only — never the face.
         COPY: carries the cold read itself, not the challenge. "TAMA BA AKO?"
         was meaningless on a muted feed scroll; a specific guess lands the
         mentalism hit at frame 1 and works with the sound off. */
      .wordgroup {
        position: absolute; left: 0; right: 0; text-align: center;
        will-change: transform, opacity;
      }
      .wordgroup .echo, .wordgroup .hero {
        position: absolute; left: 50%; top: 0; white-space: nowrap;
        font-weight: 400; text-transform: uppercase; letter-spacing: 2px;
        will-change: transform, opacity;
      }
      .echo { font-size: 102px; color: rgba(255,255,255,0.32); filter: blur(9px); }
      .hero {
        font-size: 92px;
        -webkit-text-stroke: 4px rgba(15,20,35,0.9);
        paint-order: stroke fill;
        text-shadow:
          0 0 22px rgba(255,255,255,0.35),
          0 10px 24px rgba(0,0,0,0.6),
          0 4px 0 rgba(90,60,0,0.9);
      }
      .white .hero { color: #FFFFFF; }
      .gold  .hero { color: #F5B301; }

      #g1 { top: 300px; }
      #g2 { top: 408px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.85"
      data-width="1080"
      data-height="1920"
    >
      <div class="wordgroup white" id="g1" data-layout-allow-overlap>
        <div class="echo" data-layout-allow-overlap>HINDI BARADO.</div>
        <div class="hero" data-layout-allow-overlap>HINDI BARADO.</div>
      </div>
      <div class="wordgroup gold" id="g2" data-layout-allow-overlap>
        <div class="echo" data-layout-allow-overlap>PUNO NA.</div>
        <div class="hero" data-layout-allow-overlap>PUNO NA.</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* P7 (11 corroborations, applied): text on frame 1 — the hook caption is
         already on screen when the video starts, because on a muted feed the
         TEXT does the scroll-stopping alone. g1 fires at 0, g2 a beat later. */
      const groups = [
        { hero: "#g1 .hero", echo: "#g1 .echo", at: 0.00, rot: -3 },
        { hero: "#g2 .hero", echo: "#g2 .echo", at: 0.30, rot: 2 },
      ];

      for (const g of groups) {
        /* g1 snaps (0.26s from 55%) so it is legible within ~2 frames rather
           than growing from nothing — a slow pop at t=0 is not "on frame 1". */
        const first = g.at === 0;
        tl.fromTo(g.hero,
          { xPercent: -50, scale: first ? 0.55 : 0.3, rotation: g.rot * 2, opacity: 0 },
          { xPercent: -50, scale: 1, rotation: g.rot, opacity: 1, duration: first ? 0.26 : 0.42, ease: "back.out(1.6)" },
          g.at);
        tl.fromTo(g.echo,
          { xPercent: -50, yPercent: -6, scale: 0.5, opacity: 0 },
          { xPercent: -50, yPercent: -6, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.2)" },
          g.at + 0.06);
        /* living drift so the stack never freezes under the push-in */
        tl.to(g.hero, { scale: 1.045, y: -8, duration: 2.78 - g.at, ease: "sine.inOut" }, g.at + 0.45);
        tl.to(g.echo, { scale: 1.08, y: -16, duration: 2.78 - g.at, ease: "sine.inOut" }, g.at + 0.5);
      }

      /* punctuation beat on the spoken "Puno na." (trimmed t~1.62) */
      tl.to("#g2 .hero", { scale: 1.14, duration: 0.16, ease: "power2.out", yoyo: true, repeat: 1 }, 1.62);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
