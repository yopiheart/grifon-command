<!doctype html>
<html lang="tl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A1F45; }
      body { font-family: "Inter", sans-serif; }

      /* P3 BRAND SLAM — hard cut in, 1.2s, hard cut out. Opaque full frame,
         same Oceanides navy/gold world as the end card. */
      #bg {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 40%, #0E2C5E 0%, #0A1F45 58%, #071630 100%);
      }
      /* In normal flow between brand and sub — as an absolute child of the
         auto-height #stack it escaped to the foot of the frame. */
      #rule {
        margin: 44px auto 0; width: 420px; height: 8px;
        background: #F5B301; transform-origin: 50% 50%;
      }
      #stack {
        position: absolute; left: 50%; top: 50%; width: 940px;
        transform: translate(-50%, -50%); text-align: center;
      }
      #brand {
        font-family: "Anton", sans-serif; font-weight: 400; color: #fff;
        font-size: 168px; line-height: .95; letter-spacing: 6px; text-transform: uppercase;
        text-shadow: 0 12px 30px rgba(0,0,0,.55);
        will-change: transform, opacity;
      }
      #sub {
        margin-top: 44px; font-family: "Anton", sans-serif; font-weight: 400;
        color: #F5B301; font-size: 74px; line-height: 1.06; letter-spacing: 2px;
        text-transform: uppercase; will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1.2"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg"></div>
      <div id="stack">
        <div id="brand">Oceanides</div>
        <div id="rule"></div>
        <div id="sub">Malinaw bago<br/>magsimula</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Slam, then hold with a slow push so a 1.2s card never reads frozen. */
      tl.fromTo("#brand",
        { scale: 1.45, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, 0);
      tl.fromTo("#rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.26, ease: "power3.out" }, 0.14);
      tl.fromTo("#sub",
        { y: 46, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.26, ease: "back.out(1.5)" }, 0.22);
      tl.fromTo("#stack", { scale: 1 }, { scale: 1.05, duration: 1.2, ease: "sine.out" }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
