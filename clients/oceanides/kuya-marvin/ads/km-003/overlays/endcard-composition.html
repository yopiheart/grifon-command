<!doctype html>
<html lang="tl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0A1F45; }
      body { font-family: "Inter", sans-serif; }

      #bg {
        position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, #0E2C5E 0%, #0A1F45 58%, #071630 100%);
      }
      .wave { position: absolute; bottom: 0; left: -1080px; width: 3240px; height: 360px; opacity: .14; will-change: transform; }
      .wave.two { opacity: .08; bottom: -60px; }

      #stack {
        position: absolute; left: 50%; top: 50%; width: 900px;
        transform: translate(-50%, -50%); text-align: center; will-change: transform;
      }

      .eyebrow {
        display: inline-block; background: #F5B301; color: #0A1F45;
        font-weight: 900; font-size: 26px; letter-spacing: 2.8px; text-transform: uppercase;
        padding: 12px 28px; border-radius: 10px; will-change: transform, opacity;
      }

      #h1 { margin-top: 40px; font-family: "Anton", sans-serif; font-weight: 400;
        text-transform: uppercase; color: #fff; font-size: 112px; line-height: .98; letter-spacing: 1px; }
      #h1 .line { display: block; will-change: transform, opacity; }
      #h1 .gold { color: #F5B301; }

      #sub { margin-top: 30px; font-family: "Anton", sans-serif; font-weight: 400;
        font-size: 64px; color: #fff; text-transform: uppercase; letter-spacing: 2px;
        will-change: transform, opacity; }

      #nums { margin-top: 48px; display: flex; flex-direction: column; gap: 22px; align-items: center; will-change: transform; }
      .num { display: flex; align-items: center; gap: 22px; will-change: transform, opacity; }
      .num .lbl { font-size: 27px; font-weight: 800; color: #5AA6E6; letter-spacing: 2.8px; text-transform: uppercase; width: 110px; text-align: right; }
      .num .ph { width: 72px; height: 72px; border-radius: 50%; background: #F5B301; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
      .num .ph svg { width: 38px; height: 38px; fill: #0A1F45; }
      .num .no { font-size: 57px; font-weight: 900; color: #fff; letter-spacing: .8px; }

      #attrib { margin-top: 50px; font-family: "Anton", sans-serif; font-weight: 400;
        font-size: 58px; color: #F5B301; text-transform: uppercase; letter-spacing: 1.2px; line-height: 1.12; will-change: transform, opacity; }

      /* share nudge — the One Peak move the VO speaks at ~2.4s */
      #share { margin-top: 34px; font-size: 34px; font-weight: 800; color: #dfe8f5;
        letter-spacing: .6px; will-change: transform, opacity; }
      #share b { color: #fff; }

      #foot { margin-top: 40px; font-size: 24px; font-weight: 800; color: #8fb3dd; letter-spacing: 4.4px; text-transform: uppercase; will-change: opacity; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg">
        <svg class="wave one" viewBox="0 0 3240 360" preserveAspectRatio="none">
          <path d="M0 180 C 270 60, 540 300, 810 180 S 1350 60, 1620 180 S 2160 300, 2430 180 S 2970 60, 3240 180 L 3240 360 L 0 360 Z" fill="#5AA6E6"/>
        </svg>
        <svg class="wave two" viewBox="0 0 3240 360" preserveAspectRatio="none">
          <path d="M0 200 C 270 320, 540 80, 810 200 S 1350 320, 1620 200 S 2160 80, 2430 200 S 2970 320, 3240 200 L 3240 360 L 0 360 Z" fill="#1C63AD"/>
        </svg>
      </div>

      <div id="stack">
        <span class="eyebrow" id="eyebrow">SEC Registered &bull; BIR-Registered</span>
        <div id="h1">
          <span class="line" id="l1" data-layout-allow-overlap>Banyong mabagal?</span>
          <span class="line" id="l2" data-layout-allow-overlap><span class="gold" data-layout-allow-overlap>Libreng</span> inspection</span>
        </div>
        <div id="sub">Message lang</div>
        <div id="nums">
          <div class="num" id="num-globe">
            <span class="lbl">Globe</span>
            <span class="ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.9 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.2 2.2z"/></svg></span>
            <span class="no">0917-671-6383</span>
          </div>
          <div class="num" id="num-smart">
            <span class="lbl">Smart</span>
            <span class="ph"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.7 3.9 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.2 2.2z"/></svg></span>
            <span class="no">0939-245-6217</span>
          </div>
        </div>
        <div id="attrib">"Sabihin nyo: kay<br/>Kuya Marvin kayo."</div>
        <div id="share">May kakilala kang ganito ang banyo? <b>I-send mo ito sa kanya.</b></div>
        <div id="foot">Oceanides &bull; Kuya Marvin</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* Timed to the end-card VO (speech 0.16-4.44): name at the top, the
         share-nudge line lands as he says "i-send nyo ito sa kanya". */
      tl.fromTo(".wave.one", { x: 0 }, { x: 340, duration: 5, ease: "none" }, 0);
      tl.fromTo(".wave.two", { x: 0 }, { x: -260, duration: 5, ease: "none" }, 0);
      tl.fromTo("#stack", { scale: 1.0 }, { scale: 1.022, duration: 5, ease: "sine.inOut" }, 0);

      tl.fromTo("#eyebrow",
        { y: -40, scale: 0.6, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.36, ease: "back.out(1.8)" }, 0.10);

      tl.fromTo("#l1",
        { y: 90, scale: 0.7, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.5)" }, 0.30);
      tl.fromTo("#l2",
        { y: 90, scale: 0.7, opacity: 0 },
        { y: 0, scale: 1, opacity: 1, duration: 0.38, ease: "back.out(1.5)" }, 0.46);

      tl.fromTo("#sub",
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 0.80);

      tl.fromTo("#num-globe",
        { x: -120, scale: 0.85, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.40, ease: "back.out(1.7)" }, 1.05);
      tl.fromTo("#num-smart",
        { x: 120, scale: 0.85, opacity: 0 },
        { x: 0, scale: 1, opacity: 1, duration: 0.40, ease: "back.out(1.7)" }, 1.25);
      tl.to("#nums", { scale: 1.03, duration: 0.26, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.6);

      tl.fromTo("#attrib",
        { scale: 0.5, rotation: -4, opacity: 0 },
        { scale: 1, rotation: 0, opacity: 1, duration: 0.44, ease: "back.out(1.6)" }, 1.70);

      /* share nudge on the spoken "i-send nyo ito sa kanya" */
      tl.fromTo("#share",
        { y: 26, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.38, ease: "power2.out" }, 2.55);
      tl.to("#share", { scale: 1.045, duration: 0.24, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.15);

      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 3.30);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
