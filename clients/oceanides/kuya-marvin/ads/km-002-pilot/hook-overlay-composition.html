<!doctype html>
<html lang="tl" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: transparent;
      }
      body { font-family: "Anton", sans-serif; }

      /* speech-synced hook stack — bake-off Lane B treatment, Oceanides palette:
         gold hero word groups with a blurred white echo behind, dark stroke +
         shadow (outline-not-box, swipe P2), pop entrance + living drift */
      .wordgroup {
        position: absolute; left: 0; right: 0; text-align: center;
        will-change: transform, opacity;
      }
      .wordgroup .echo, .wordgroup .hero {
        position: absolute; left: 50%; top: 0; white-space: nowrap;
        font-weight: 400; text-transform: uppercase; letter-spacing: 2px;
        will-change: transform, opacity;
      }
      .echo {
        font-size: 118px; color: rgba(255,255,255,0.32); filter: blur(9px);
      }
      .hero {
        font-size: 106px;
        -webkit-text-stroke: 4px rgba(15,20,35,0.9);
        paint-order: stroke fill;
        text-shadow:
          0 0 22px rgba(255,255,255,0.35),
          0 10px 24px rgba(0,0,0,0.6),
          0 4px 0 rgba(90,60,0,0.9);
      }
      .white .hero { color: #FFFFFF; }
      .gold .hero { color: #F5B301; }

      #g1 { top: 170px; }
      #g2 { top: 300px; }
      #g3 { top: 430px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div class="wordgroup white" id="g1" data-layout-allow-overlap>
        <div class="echo" data-layout-allow-overlap>TAKOT KA</div>
        <div class="hero" data-layout-allow-overlap>TAKOT KA</div>
      </div>
      <div class="wordgroup white" id="g2" data-layout-allow-overlap>
        <div class="echo" data-layout-allow-overlap>TUMAWAG</div>
        <div class="hero" data-layout-allow-overlap>TUMAWAG</div>
      </div>
      <div class="wordgroup gold" id="g3" data-layout-allow-overlap>
        <div class="echo" data-layout-allow-overlap>NG PASIPSIP?</div>
        <div class="hero" data-layout-allow-overlap>NG PASIPSIP?</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // speech map (STS clip): "Takot ka" 0.85 · "tumawag ng" 1.95 · "pasipsip?" 3.30
      const groups = [
        { hero: "#g1 .hero", echo: "#g1 .echo", at: 0.85, rot: -3 },
        { hero: "#g2 .hero", echo: "#g2 .echo", at: 1.95, rot: 2 },
        { hero: "#g3 .hero", echo: "#g3 .echo", at: 3.30, rot: -2 },
      ];

      for (const g of groups) {
        // hero: pop with overshoot + rotation settle (bake-off signature)
        tl.fromTo(g.hero,
          { xPercent: -50, scale: 0.3, rotation: g.rot * 2, opacity: 0 },
          { xPercent: -50, scale: 1, rotation: g.rot, opacity: 1, duration: 0.42, ease: "back.out(1.6)" },
          g.at);
        // echo: follows a beat behind, larger and soft
        tl.fromTo(g.echo,
          { xPercent: -50, yPercent: -6, scale: 0.5, opacity: 0 },
          { xPercent: -50, yPercent: -6, scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.2)" },
          g.at + 0.06);
        // living drift while held (never frozen)
        tl.to(g.hero, { scale: 1.045, y: -8, duration: 5.9 - g.at, ease: "sine.inOut" }, g.at + 0.45);
        tl.to(g.echo, { scale: 1.08, y: -16, duration: 5.9 - g.at, ease: "sine.inOut" }, g.at + 0.5);
      }

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
