<!doctype html>
<!-- TB2 #2 — Niche callout (S8 / E5 Sabri format). City variable: QUEZON CITY -->
<html lang="tl"><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#0E2C5E;--navy2:#0A1F45;--ocean:#1C63AD;--sky:#5AA6E6;--gold:#F5B301;
--head:'Anton','Arial Narrow',Impact,sans-serif;--body:'Inter','Helvetica Neue',Arial,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:#333}
#canvas{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--body);background:var(--navy);-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 900px 600px at 50% 8%,rgba(28,99,173,.55) 0%,rgba(14,44,94,0) 62%)}
.logo-chip{position:absolute;top:34px;left:34px;z-index:5;background:#fff;border-radius:12px;padding:5px 9px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.logo-chip img{height:54px;display:block}
.legit{position:absolute;top:40px;right:34px;z-index:5;display:flex;align-items:center;gap:10px}
.legit .t{text-align:right;line-height:1.1}.legit .c{font-weight:900;font-size:14px;color:#fff;text-transform:uppercase}
.legit .s{font-size:11px;font-weight:700;color:var(--sky);text-transform:uppercase;margin-top:2px}
.legit img{height:46px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.mid{position:absolute;top:236px;left:60px;right:60px;z-index:5;text-align:center}
.eyebrow{display:inline-block;background:var(--gold);color:var(--navy);font-weight:900;font-size:23px;letter-spacing:2px;text-transform:uppercase;padding:13px 28px;border-radius:8px}
h1{font-family:var(--head);font-weight:400;font-size:104px;line-height:1.02;color:#fff;text-transform:uppercase;letter-spacing:.5px;margin-top:52px}
h1 .g{color:var(--gold)}
.sub{font-size:31px;font-weight:600;color:rgba(255,255,255,.92);margin-top:46px;line-height:1.4}
.sub b{color:var(--gold);font-weight:800}
.ctapill{position:absolute;left:50%;transform:translateX(-50%);bottom:252px;z-index:6;background:var(--gold);color:var(--navy2);border-radius:999px;padding:26px 64px;font-weight:900;font-size:36px;letter-spacing:.5px;text-transform:uppercase;box-shadow:0 10px 34px rgba(245,179,1,.35)}
.contact{position:absolute;bottom:0;left:0;width:100%;z-index:6;padding:26px 44px 30px;text-align:center;background:var(--navy2)}
.nums{display:flex;justify-content:center;gap:44px}
.num{display:flex;align-items:center;gap:11px}.num .ph{width:38px;height:38px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
.num .ph svg{width:21px;height:21px;fill:var(--navy2)}.num .txt{text-align:left}
.num .lbl{font-size:13px;font-weight:800;color:var(--sky);letter-spacing:1.5px;text-transform:uppercase}
.num .no{font-size:27px;font-weight:900;color:#fff}
.areas{margin-top:12px;font-size:16px;font-weight:800;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
</style></head><body>
<div id="canvas">
  <div class="glow"></div>
  <div class="logo-chip"><img src="../assets/logo.jpg" alt="Oceanides"/></div>
  <div class="legit"><div class="t"><div class="c">SEC-Registered</div><div class="s">DENR &middot; BIR</div></div><img src="../assets/badge-bir.png" alt="BIR"/></div>
  <div class="mid">
    <span class="eyebrow">Sa mga may-ari ng bahay sa Quezon City</span>
    <h1>MABAGAL ANG FLUSH?<br/>MAY AMOY SA BANYO?<br/><span class="g">'WAG HINTAYIN<br/>ANG UMAPAW.</span></h1>
    <div class="sub"><b>Libreng inspection.</b> Sagot ng team namin sa QC ngayong araw.</div>
  </div>
  <div class="ctapill">Call Now</div>
  <div class="contact">
    <div class="nums">
      <div class="num"><div class="ph"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.18z"/></svg></div><div class="txt"><div class="lbl">Globe</div><div class="no">0917-671-6383</div></div></div>
      <div class="num"><div class="ph"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.24.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.18z"/></svg></div><div class="txt"><div class="lbl">Smart</div><div class="no">0939-245-6217</div></div></div>
    </div>
    <div class="areas">Oceanides &middot; Quezon City Branch</div>
  </div>
</div></body></html>
