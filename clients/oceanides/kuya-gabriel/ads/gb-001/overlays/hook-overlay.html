<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  /* 🔴 FRAME 0: buo na ang teksto sa unang frame, WALANG fade-in. Frame 0 ang
     kinukuha ni Meta bilang thumbnail — ang KM-003 ay nag-fade in kaya blangkong
     mukha ang napili at kinailangan pang manwal na pumili ng frame. */
  .stack {
    position: absolute;
    left: 0; right: 0;
    top: 300px;            /* feed-safe top ay 285. */
    text-align: center;
  }
  /* Ang ibaba ng stack ay ~520px. Ang buhok ni Gabriel sa r1 ay nagsisimula sa
     ~570px at umaakyat ng kaunti habang nag-push-in — kaya may ~50px na luwag.
     FACE-SAFE ang batas: kahit kailan ay walang teksto sa mukha nya. */
  .line {
    display: inline-block;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: 0.01em;
    color: var(--white);
    background: var(--navy-deep);
    padding: 10px 26px 16px;
    margin-bottom: 10px;
    /* Outline, hindi solid na kahon sa buong lapad — P2, 8 corroborations. */
    box-shadow: 0 0 0 5px var(--amber);
  }
  .line.two { color: var(--amber); }
</style>
</head>
<body>
  <div class="stage">
    <div class="stack" id="stack">
      <div class="line" id="l1">HINDI BARADO.</div><br>
      <div class="line two" id="l2">PUNO NA.</div>
    </div>
  </div>
<script>
  // Ang overlay ay dapat may KAHULUGAN kapag naka-mute (aral #15, P7 na may 11
  // corroborations). Hindi nito inuulit ang binibigkas at hindi sya hamon —
  // dala nya ang mismong claim: hindi barado, puno na. Yun ang humihinto ng
  // scroll nang mag-isa, bago pa may marinig.
  const l1 = document.getElementById('l1');
  const l2 = document.getElementById('l2');
  window.render = function (t) {
    // Walang fade sa unang linya. Ang pangalawa ay sumasalpok sa 0.42s —
    // sapat para mahuli ng mata bilang dalawang beat, hindi isang blokeng
    // teksto, pero nasa frame 0 pa rin ang unang linya.
    const hit = 0.42, grow = 0.16;
    const p = Math.max(0, Math.min(1, (t - hit) / grow));
    const ease = 1 - Math.pow(1 - p, 3);
    l1.style.opacity = 1;
    l2.style.opacity = t >= hit ? 1 : 0;
    l2.style.transform = 'scale(' + (t >= hit ? (1.18 - 0.18 * ease) : 1.18) + ')';
  };
  window.render(0);
</script>
</body>
</html>
