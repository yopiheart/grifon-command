<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
  /* END CARD — 🔴 WALANG PRESYO, WALANG NUMERO.
     `oceanides_offer_price_page.md` §9: ang PAGE ang nagsasabi ng presyo, hindi
     ang ad. Ang ibinebenta dito ay ang katotohanang NAKASULAT sya, hindi ang
     halaga. Lahat ng teksto ay nasa loob ng feed-safe 285-1635. */
  body { background: var(--navy-deep); }
  .stage {
    background:
      radial-gradient(110% 70% at 50% 38%, rgba(28,99,173,.38) 0%, rgba(10,31,69,0) 62%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 60%, var(--navy-void) 100%);
  }
  .mid {
    position: absolute;
    left: 80px; right: 80px;
    top: 470px;
    text-align: center;
  }
  /* Oceanides seal (Neil, 2026-08-03). Puting bilog para buhay sya sa navy —
     ganito rin sya nakaupo sa ticket at sa page. Nasa loob ng feed-safe. */
  .logo {
    width: 170px; height: 170px;
    margin: 0 auto 44px;
    border-radius: 50%;
    background: #fff;
    padding: 10px;
    box-shadow: 0 12px 40px rgba(7, 22, 48, .5);
    opacity: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
  .kicker {
    font-family: 'InterBlack', Arial, sans-serif;
    font-size: 32px; letter-spacing: .3em;
    color: var(--dim);
    margin-bottom: 40px;
    opacity: 0;
  }
  .big {
    font-family: 'Anton', Impact, sans-serif;
    font-size: 128px; line-height: 1.02;
    color: var(--white);
    margin-bottom: 56px;
    opacity: 0;
  }
  .url {
    display: inline-block;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 84px; letter-spacing: .01em;
    color: var(--navy-deep);
    background: var(--amber);
    padding: 18px 44px 26px;
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="stage"></div>
  <div class="mid">
    <div class="logo" id="lg"><img src="../../../../assets/logo.jpg" alt=""></div>
    <div class="kicker" id="k">NAKASULAT ANG BUONG PRESYO</div>
    <div class="big" id="b">BASAHIN<br>MO MUNA</div>
    <div class="url" id="u">OCEANIDESPH.COM</div>
  </div>
<script>
  const lg = document.getElementById('lg');
  const k = document.getElementById('k');
  const b = document.getElementById('b');
  const u = document.getElementById('u');
  window.render = function (t) {
    const step = (at, dur) => {
      const p = Math.max(0, Math.min(1, (t - at) / dur));
      return 1 - Math.pow(1 - p, 3);
    };
    const e0 = step(0.02, 0.22), e1 = step(0.05, 0.25), e2 = step(0.24, 0.26), e3 = step(0.62, 0.24);
    lg.style.opacity = e0;
    lg.style.transform = 'scale(' + (0.92 + 0.08 * e0) + ')';
    k.style.opacity = e1;
    b.style.opacity = e2;
    b.style.transform = 'translateY(' + (22 - 22 * e2) + 'px)';
    u.style.opacity = e3;
    // Slam, hindi pag-usbong — ang URL ang huling bagay na dapat matandaan.
    u.style.transform = 'scale(' + (1.2 - 0.2 * e3) + ')';
  };
  window.render(0);
</script>
</body>
</html>
